# cargo-mutants' configuration (`docs/05-testing/01-quality-bar.md`,
# "mutation testing"; `.github/workflows/mutants.yml` runs it).
#
# `exclude_re` lists the equivalent mutants: changes no test can catch
# because they do not change what the code computes. Each is anchored to
# its line and column, so a line that moves frees its mutant, which then
# survives and fails `check-mutants` until the entry follows it; each says
# why it is equivalent. A mutant that is merely hard to catch is not listed
# here: it gets its test.
# Every feature on, as clippy builds: a mutant inside a feature's code,
# such as a type's JSON Schema, is otherwise compiled out and survives.
all_features = true

exclude_re = [
  # The samudaya product is (rashi + graha) * 7 / 27 over whole pindas,
  # which is exactly 100 only at a sum of 2700 / 7, not a whole number.
  'crates/rules/src/longevity/ashtakavarga\.rs:819:35: replace > with >= in Evaluator<._>::ashtakavarga_ayus',
  # A child's end is `from + days * s / total`; at `s == total` the
  # product's rounding is an ulp of a period's days (about 1e-12 for
  # 7000), below a JD's own ulp (4.7e-10 near 2.4e6), so the sum lands on
  # the parent's end either way. Only a period as long as the JD itself
  # could part the two.
  'crates/dasha/src/tree\.rs:1223:22: replace match guard s == total with false in <impl Timeline for Dasha>::child',
  # Under END `mahadasha` refuses every later cycle itself, and no row
  # has a cycle of no days, so the guard's second clause decides nothing.
  'crates/dasha/src/tree\.rs:1255:58: replace \|\| with && in <impl Timeline for Dasha>::mahadasha_at',
  # The search runs in order and the first period still running ends past
  # the instant, so its start is already at or before it: the lower bound
  # confirms what the upper one found and never decides.
  'crates/dasha/src/tree\.rs:1274:41: replace \+ with - in <impl Timeline for Dasha>::mahadasha_at',
  # Before birth `within` is negative, which the search's `*from <= within`
  # refuses on its own.
  'crates/dasha/src/rashi\.rs:2015:23: replace \|\| with && in <impl Timeline for RashiDasha>::mahadasha_at',
  # `offsets` has one entry more than the running mahadashas, so an index
  # past them finds no end and answers nothing whatever the guard says.
  'crates/dasha/src/kalachakra\.rs:520:36: replace \|\| with && in <impl Timeline for KalachakraDasha>::mahadasha',
  # A body on either node's sign has already ended the count, so `from`
  # never equals `arc` where the side is chosen.
  'crates/rules/src/eval\.rs:1763:72: replace > with >= in Evaluator<.a>::predicate',
  # Two strengths a span's chosen by differ by exactly the epsilon only by
  # chance no chart's arithmetic makes, so the bound's own point is never
  # met.
  'crates/rules/src/longevity/ayurdaya\.rs:719:67: replace < with <= in Ayurdaya::chosen',
  # Two distinct own signs stand at distinct counts from the graha, so
  # the greater count is never a tie.
  'crates/dasha/src/jaimini\.rs:585:33: replace > with >= in graha_arudha',
  # A profected year has no children (`child` is always nothing), so a
  # breadth of one asks for a child that is never there.
  'crates/dasha/src/releasing\.rs:592:9: replace <impl Timeline for ProfectionDasha>::breadth -> usize with 1',
  # Two stored spans are alike within a millionth of a day, and a third
  # level's period is a thirtieth of its mahadasha within a billionth:
  # spans that far apart to the bit are never written, so the bound's own
  # point reads the same either side.
  'crates/dasha/src/reading\.rs:632:63: replace < with <= in DashaReading::graha_division',
  'crates/dasha/src/reading\.rs:866:44: replace < with <= in DashaReading::decennial_division',
  # The step either side of a lattice boundary is a hundredth or a hundred
  # times the tolerance: both put the two readings on either side of it,
  # and the parts are degrees wide.
  'crates/vargas/src/change\.rs:250:35: replace \* with / in by_lattice',
  # `left <= to` loops once more at `left == to`, where `right` is `to`
  # again and the `right >= to` break ends it with nothing found.
  'crates/vargas/src/change\.rs:281:16: replace < with <= in by_bisection',
  # When the occupied sign's number equals the empty one's, what is left
  # the empty one is their difference, nothing, either way.
  'crates/strength/src/ashtakavarga\.rs:469:65: replace < with <= in ekadhipatya',
  # At exactly 180° the shorter arc is 180 either way.
  'crates/strength/src/shadbala/mod\.rs:496:13: replace > with >= in apart',
  # Ketu is Rahu less 180° or plus 180°: the same point.
  'crates/strength/src/shadbala/mod\.rs:545:65: replace \+ with - in is_benefic',
  # An arc past 180° folded down by 360° or up by it puts half of it on
  # the same point once the madhyama is reduced past 360°.
  'crates/strength/src/shadbala/cheshta\.rs:54:13: replace -= with \+= in from_kendra',
  # The kendra opposite an angle is the angle less 180° or plus it, and so
  # is the point a graha is powerless at.
  'crates/strength/src/shadbala/dig\.rs:17:48: replace \+ with - in of',
  'crates/strength/src/shadbala/dig\.rs:18:36: replace \+ with - in of',
  'crates/strength/src/shadbala/dig\.rs:25:54: replace \+ with - in of',
  # A bhuja of exactly 90° is 90 folded or not.
  'crates/strength/src/shadbala/kaala\.rs:199:31: replace > with >= in kranti',
  # At a sayana of exactly 180° the bhuja is 0, so the kranti is zero of
  # either sign.
  'crates/strength/src/shadbala/kaala\.rs:216:30: replace < with <= in kranti',
  # `skip(i * 1)` adds each graha's pair with itself, whose discs differ by
  # nothing, which the loop skips.
  'crates/strength/src/shadbala/yuddha\.rs:27:58: replace \+ with \* in apply',
  # Two grahas at war are within a degree, so the arc from one to the other
  # is never exactly 180°.
  'crates/strength/src/shadbala/yuddha\.rs:42:56: replace < with <= in apply',
]
