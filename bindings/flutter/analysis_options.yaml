# Held to the same lints and strictness as the Dart binding it bundles.
include: package:lints/recommended.yaml

analyzer:
  # The example is a Flutter app, analysed by `check-flutter` with the
  # Flutter SDK; this package's own gate is plain Dart.
  exclude:
    - example/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: ignore
    # The checkout depends on `teistro` by `path: ../dart`, which a
    # publishable package may not; `cargo xtask package stage` writes the
    # exact version in its place, and refuses a pubspec without that path.
    invalid_dependency: ignore
