# Held to the same lints and strictness as the Dart binding it bundles.
include: package:lints/recommended.yaml

analyzer:
  # The example is a Flutter app, analysed by `check-flutter` with the
  # Flutter SDK; this package's own gate is plain Dart.
  exclude:
    - example/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: ignore
