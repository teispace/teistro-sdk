# The Dart binding is held to the recommended lints, with the generated
# files excluded from style rules they cannot follow (a C name is not
# camel case) but not from analysis: they must still be correct Dart.
include: package:lints/recommended.yaml

analyzer:
  # The file whose whole purpose is to be wrong; the gate analyses it on
  # its own and fails unless every error it expects is reported.
  exclude:
    - typecheck/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: ignore
