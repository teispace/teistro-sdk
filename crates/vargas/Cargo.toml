[package]
name = "teistro-vargas"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Teistro SDK's divisional charts: one table-driven evaluator, twenty-one rows, and arbitrary D-N under a stated convention"
readme = "README.md"
# Not published until the Phase 1 exit (docs/07-roadmap/00-roadmap.md).
publish = false

[dependencies]
teistro-astro = { path = "../astro" }
teistro-chart = { path = "../chart" }
teistro-core = { path = "../core" }
teistro-port-ephemeris = { path = "../port-ephemeris" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
teistro-calendar = { path = "../calendar" }
teistro-time = { path = "../time" }

[lints]
workspace = true
