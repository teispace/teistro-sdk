[package]
name = "teistro-vargas"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Teistro SDK's divisional charts: one table-driven evaluator, twenty-one rows, and arbitrary D-N under a stated convention"
readme = "README.md"
# The name is held on crates.io — a 0.0.0 placeholder published
# 2026-09-10 — and this crate publishes for real at the first
# release, never on a phase boundary
# (docs/06-cicd/03-release-process.md).
publish = false

[dependencies]
teistro-astro = { path = "../astro" }
teistro-chart = { path = "../chart" }
teistro-core = { path = "../core" }
teistro-port-ephemeris = { path = "../port-ephemeris" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
teistro-calendar = { path = "../calendar" }
teistro-time = { path = "../time" }

[lints]
workspace = true
