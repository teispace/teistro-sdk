[package]
name = "teistro-interpret"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Teistro SDK's composers: a chart's answers as a narrative plan of message keys and slots"
readme = "README.md"
# Publishes at the first release, never on a phase boundary
# (docs/06-cicd/03-release-process.md).
publish = false

[features]
# Derives `schemars::JsonSchema` on every type this crate serialises,
# so the agent server states its tools' answers (`03-design/mcp-server.md`
# §7, P1).
schema = ["dep:schemars", "dep:serde_json", "teistro-aspect/schema", "teistro-chart/schema", "teistro-core/schema", "teistro-gochar/schema", "teistro-houses/schema", "teistro-rashifal?/schema", "teistro-rules/schema", "teistro-state/schema", "teistro-strength/schema"]
# The rashifal's composer (`03-design/rashifal.md`, "Said in words"),
# which reads a `RashiReading`: on with the façade's `rashifal` family, so
# a build that leaves the family out leaves its crate out here too.
rashifal = ["dep:teistro-rashifal"]

[dependencies]
teistro-aspect = { path = "../aspect", version = "=1.0.0-rc.2" }
teistro-chart = { path = "../chart", version = "=1.0.0-rc.2" }
teistro-core = { path = "../core", version = "=1.0.0-rc.2" }
teistro-gochar = { path = "../gochar", version = "=1.0.0-rc.2" }
teistro-houses = { path = "../houses", version = "=1.0.0-rc.2" }
teistro-rashifal = { path = "../rashifal", version = "=1.0.0-rc.2", optional = true }
teistro-intl = { path = "../intl", version = "=1.0.0-rc.2", default-features = false }
teistro-rules = { path = "../rules", version = "=1.0.0-rc.2" }
teistro-state = { path = "../state", version = "=1.0.0-rc.2" }
teistro-strength = { path = "../strength", version = "=1.0.0-rc.2" }
serde = { version = "1", features = ["derive"] }
schemars = { version = "1.2", optional = true }
# A message's slots are described as JSON values (`Item::params`).
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
