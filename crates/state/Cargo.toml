[package]
name = "teistro-state"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Teistro SDK's planetary state: dignity, the three friendships, combustion, the ages, the planetary war and the avasthas"
readme = "README.md"
# Not published until the Phase 1 exit (docs/07-roadmap/00-roadmap.md).
publish = false

[dependencies]
teistro-chart = { path = "../chart" }
teistro-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
teistro-astro = { path = "../astro" }
teistro-calendar = { path = "../calendar" }
teistro-port-ephemeris = { path = "../port-ephemeris" }

[lints]
workspace = true
