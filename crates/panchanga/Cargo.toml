[package]
name = "teistro-panchanga"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Teistro SDK's daily panchanga: the almanac of one day at one place, with every limb as a span and every period as a division of an arc"
readme = "README.md"
# The name is held on crates.io — a 0.0.0 placeholder published
# 2026-09-10 — and this crate publishes for real at the first
# release, never on a phase boundary
# (docs/06-cicd/03-release-process.md).
publish = false

[features]
# Derives `schemars::JsonSchema` on the types a chart document carries,
# so `cargo xtask gen document-schema` can describe it
# (`docs/03-design/document-schema.md`).
# Reads a published set from a signed pack: its exact bytes, a detached
# Ed25519 signature and the publisher's key, which the caller supplies
# (`docs/03-design/published-overrides.md` §5).
signed-packs = ["teistro-core/signed-packs"]
schema = ["dep:schemars", "teistro-astro/schema", "teistro-calendar/schema", "teistro-chart/schema", "teistro-core/schema", "teistro-port-ephemeris/schema", "teistro-time/schema"]

[dependencies]
teistro-astro = { path = "../astro" }
teistro-calendar = { path = "../calendar" }
teistro-chart = { path = "../chart" }
teistro-core = { path = "../core" }
teistro-port-ephemeris = { path = "../port-ephemeris" }
teistro-time = { path = "../time" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.2", optional = true }

[dev-dependencies]
# Signs the test packs with a key made in the test.
ed25519-dalek = { version = "3", default-features = false }
teistro-test-allocator = { path = "../test-allocator" }

[lints]
workspace = true
