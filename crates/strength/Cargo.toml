[package]
name = "teistro-strength"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Teistro SDK's strength measures: the Ashtakavarga, the Vimshopaka, and the bala schemes to come"
readme = "README.md"
# Claimed on crates.io at the release, as every module is
# (docs/06-cicd/03-release-process.md).
publish = false

[features]
# Derives `schemars::JsonSchema` on the types a chart document carries
# (`docs/03-design/document-schema.md`).
schema = ["dep:schemars", "teistro-core/schema", "teistro-state/schema"]

[dependencies]
teistro-core = { path = "../core" }
teistro-state = { path = "../state" }
serde = { version = "1", features = ["derive"] }
schemars = { version = "1.2", optional = true }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
