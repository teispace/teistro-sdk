[package]
name = "teistro-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Teistro SDK core: keys and the catalogue, exact angles and rationals, validated quantities, settings and profiles, the result envelope"
readme = "README.md"
keywords = ["astrology", "jyotisha", "vedic", "ephemeris"]
categories = ["science", "date-and-time"]
# Not published until the Phase 1 exit (docs/07-roadmap/00-roadmap.md).
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
proptest = "1"
trybuild = "1"

[[bench]]
name = "core"
harness = false

[lints]
workspace = true
