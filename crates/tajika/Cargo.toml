[package]
name = "teistro-tajika"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Teistro SDK's Tajika: the annual chart's instant, the Sun's return to where it stood at birth"
readme = "README.md"
# Publishes at the first release, never on a phase boundary
# (docs/06-cicd/03-release-process.md).
publish = false

[features]
# Derives `schemars::JsonSchema` on the types a chart document carries,
# so `cargo xtask gen document-schema` can describe it
# (`docs/03-design/document-schema.md`).
schema = ["dep:schemars", "teistro-core/schema", "teistro-dasha/schema"]

[dependencies]
teistro-astro = { path = "../astro" }
teistro-core = { path = "../core" }
teistro-dasha = { path = "../dasha" }
teistro-port-ephemeris = { path = "../port-ephemeris" }
teistro-vargas = { path = "../vargas" }
serde = { version = "1", features = ["derive"] }
schemars = { version = "1.2", optional = true }

[dev-dependencies]
serde_json = "1"
teistro-ephemeris-builtin = { path = "../ephemeris-builtin" }

[lints]
workspace = true
