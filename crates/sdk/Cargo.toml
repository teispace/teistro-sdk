[package]
name = "teistro"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Teistro SDK for Rust: one context over the calendars, the time scales, the locale engine and the ephemeris port, with a reason attached to every number"
readme = "README.md"
keywords = ["astrology", "ephemeris", "calendar", "panchanga"]
categories = ["science", "date-and-time"]
# The name is the one `03-design/rust-consumer-surface.md` §9 leaves to
# the maintainer, used here so the crate can be built and measured. A
# rename is one `sed`; nothing outside this manifest spells it.
publish = false
# Every test file is a module of `tests/suite.rs` unless it is listed
# below with a target of its own (see that file).
autotests = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.2", optional = true }
teistro-aspect = { path = "../aspect", version = "=1.0.0-rc.12" }
teistro-astro = { path = "../astro", version = "=1.0.0-rc.12" }
teistro-calendar = { path = "../calendar", version = "=1.0.0-rc.12" }
teistro-chart = { path = "../chart", version = "=1.0.0-rc.12" }
teistro-core = { path = "../core", version = "=1.0.0-rc.12" }
teistro-dasha = { path = "../dasha", version = "=1.0.0-rc.12", optional = true }
teistro-hellenistic = { path = "../hellenistic", version = "=1.0.0-rc.12", optional = true }
teistro-matching = { path = "../matching", version = "=1.0.0-rc.12", optional = true }
teistro-lalkitab = { path = "../lalkitab", version = "=1.0.0-rc.12", optional = true }
teistro-pakshi = { path = "../pakshi", version = "=1.0.0-rc.12", optional = true }
teistro-numerology = { path = "../numerology", version = "=1.0.0-rc.12", optional = true }
teistro-research = { path = "../research", version = "=1.0.0-rc.12", optional = true }
teistro-prashna = { path = "../prashna", version = "=1.0.0-rc.12", optional = true }
teistro-remedies = { path = "../remedies", version = "=1.0.0-rc.12", optional = true }
teistro-rashifal = { path = "../rashifal", version = "=1.0.0-rc.12", optional = true }
teistro-rectification = { path = "../rectification", version = "=1.0.0-rc.12", optional = true }
teistro-houses = { path = "../houses", version = "=1.0.0-rc.12" }
teistro-interpret = { path = "../interpret", version = "=1.0.0-rc.12", optional = true }
teistro-intl = { path = "../intl", version = "=1.0.0-rc.12", default-features = false }
teistro-idl = { path = "../idl", version = "=1.0.0-rc.12", default-features = false }
teistro-panchanga = { path = "../panchanga", version = "=1.0.0-rc.12" }
teistro-points = { path = "../points", version = "=1.0.0-rc.12" }
teistro-rules = { path = "../rules", version = "=1.0.0-rc.12", optional = true }
teistro-strength = { path = "../strength", version = "=1.0.0-rc.12", optional = true }
teistro-tajika = { path = "../tajika", version = "=1.0.0-rc.12", optional = true }
teistro-gochar = { path = "../gochar", version = "=1.0.0-rc.12", optional = true }
teistro-kp = { path = "../kp", version = "=1.0.0-rc.12", optional = true }
teistro-muhurta = { path = "../muhurta", version = "=1.0.0-rc.12", optional = true }
teistro-port-ephemeris = { path = "../port-ephemeris", version = "=1.0.0-rc.12" }
teistro-port-geo = { path = "../port-geo", version = "=1.0.0-rc.12" }
teistro-serial = { path = "../serial", version = "=1.0.0-rc.12", optional = true }
teistro-siddhanta = { path = "../siddhanta", version = "=1.0.0-rc.12" }
teistro-geometry = { path = "../geometry", version = "=1.0.0-rc.12" }
teistro-render-svg = { path = "../render-svg", version = "=1.0.0-rc.12", optional = true }
teistro-state = { path = "../state", version = "=1.0.0-rc.12" }
teistro-time = { path = "../time", version = "=1.0.0-rc.12" }
teistro-vargas = { path = "../vargas", version = "=1.0.0-rc.12" }
teistro-western = { path = "../western", version = "=1.0.0-rc.12", optional = true }
teistro-ephemeris-builtin = { path = "../ephemeris-builtin", version = "=1.0.0-rc.12", optional = true, default-features = false }

[build-dependencies]
teistro-intl = { path = "../intl", version = "=1.0.0-rc.12", default-features = false }

# The SDK's own ephemeris, so a consumer who installs nothing else still
# computes a chart (ADR-0008, ADR-0028) — the same feature the boundary
# crate carries, and the same three tiers, because a tier is a feature of
# the builtin crate and a consumer of this one chooses it here.
#
# **`builtin-ephemeris` names no tier**, and the default names `standard`.
# Tiers are additive and the richest wins, so a base feature that carried
# `standard` itself made `compact` unreachable: every tier feature turns
# the base one on, and the base one brought `standard` with it. Measured
# 2026-09-25, when a wasm module asked for `compact` and was 3 KB from
# `standard`; the tier test in `crates/ffi/tests/tier.rs` now holds it.
[features]
default = ["builtin-standard", "full", "signed-packs"]
# Reads a published set from a signed pack, verified against the key the
# caller fixes at its own build (`03-design/published-overrides.md` §5):
# `PublishedSet::from_signed`. Off, a consumer verifies with its own
# transport and passes the set. Not a module family, since it turns on no
# crate of its own, so the default names it beside `full`.
signed-packs = ["teistro-panchanga/signed-packs", "teistro-time/signed-packs"]
# The locales the library embeds beside `en-Latn`, which every other falls
# back on and which is always embedded (SR-150). Each is one feature,
# `locale-` and its tag in lower case; `locales` names them all and is the
# default. A build that leaves one out still answers in it once its bundle
# is loaded (`IntlArea::load_pack`, the release's `.tbundle` assets), and
# refuses it until then. `build.rs` refuses a locale under `i18n/` that has
# no feature here, so a new locale cannot be embedded unswitchably. `full`
# names `locales`: a build that asks for everything gets every locale, and
# one that names its families gets `en-Latn` and the locales it names.
locales = ["locale-en-latn-np", "locale-hi-deva-in", "locale-ne-deva-np", "locale-sa-deva", "locale-sa-latn"]
locale-en-latn-np = []
locale-hi-deva-in = []
locale-ne-deva-np = []
locale-sa-deva = []
locale-sa-latn = []
# The texts a build may leave out of its bundles (core#241,
# `03-design/wasm-profiles.md`, "Text switches"): a festival's description
# (SR-153), why a muhurta window is good (SR-154) and the rashifal's
# reading voice (SR-152), each its words in every embedded locale. `texts`
# names them all and `full` names `texts`. A build without one keeps the
# code and every other answer, refuses a request for the text as
# `UNSUPPORTED` naming the feature, and still renders the words once a
# pack carrying them is loaded. A switch whose family is off says nothing,
# and its words are left out with the family.
texts = ["festival-about", "muhurta-reasons", "rashifal-reading"]
festival-about = []
muhurta-reasons = []
rashifal-reading = []
# A module family: a crate, its methods here and its re-exports, left out
# of a build that does not name it (`03-design/wasm-profiles.md`). A build
# without a family keeps every other answer; the boundary refuses a call
# into the family as `CAPABILITY`. `full` names them all and is the
# default, so a build that names none is the `panchanga` profile.
full = ["locales", "texts", "chart", "kp", "lalkitab", "muhurta", "numerology", "pakshi", "prashna", "rashifal", "rectification", "remedies", "research", "svg", "tajika", "western"]
# The chart area: `ChartArea`, the interpretation area and the crates only
# they reach. Every family read off a chart requires it.
chart = [
    "dep:teistro-dasha",
    "dep:teistro-gochar",
    "dep:teistro-hellenistic",
    "dep:teistro-interpret",
    "dep:teistro-matching",
    "dep:teistro-rules",
    "dep:teistro-serial",
    "dep:teistro-strength",
]
kp = ["chart", "dep:teistro-kp"]
lalkitab = ["chart", "dep:teistro-lalkitab"]
muhurta = ["dep:teistro-muhurta"]
numerology = ["dep:teistro-numerology"]
pakshi = ["chart", "dep:teistro-pakshi"]
prashna = ["chart", "dep:teistro-prashna"]
rectification = ["chart", "dep:teistro-rectification"]
# The rashifal, with its reading voice (`03-design/rashifal-reading.md`, SR-152).
rashifal = ["chart", "dep:teistro-rashifal", "teistro-interpret/rashifal", "teistro-interpret/rashifal-reading"]
remedies = ["chart", "dep:teistro-remedies"]
research = ["chart", "dep:teistro-research"]
svg = ["chart", "dep:teistro-render-svg"]
tajika = ["chart", "dep:teistro-tajika"]
western = ["chart", "dep:teistro-western"]
# Each record's request and answer as JSON Schema, derived by schemars
# from the types serde reads and writes (`03-design/mcp-server.md` §7,
# P1): what the agent server's tools state. A family left out of the
# build contributes nothing (`?`).
# A caller's field mask, checked against the answer schemas `xtask` writes
# into `src/records/answers.json`: the shapes alone, so a library answers a
# mask without linking schemars and every type's schema (`fields` in
# `teistro-ffi`).
masks = []
schema = [
    "dep:schemars",
    "masks",
    "teistro-aspect/schema",
    "teistro-astro/schema",
    "teistro-calendar/schema",
    "teistro-chart/schema",
    "teistro-core/schema",
    "teistro-geometry/schema",
    "teistro-houses/schema",
    "teistro-intl/words-schema",
    "teistro-panchanga/schema",
    "teistro-points/schema",
    "teistro-port-ephemeris/schema",
    "teistro-port-geo/schema",
    "teistro-siddhanta/schema",
    "teistro-state/schema",
    "teistro-time/schema",
    "teistro-vargas/schema",
    "teistro-dasha?/schema",
    "teistro-gochar?/schema",
    "teistro-hellenistic?/schema",
    "teistro-interpret?/schema",
    "teistro-kp?/schema",
    "teistro-lalkitab?/schema",
    "teistro-matching?/schema",
    "teistro-muhurta?/schema",
    "teistro-numerology?/schema",
    "teistro-pakshi?/schema",
    "teistro-prashna?/schema",
    "teistro-rashifal?/schema",
    "teistro-rectification?/schema",
    "teistro-remedies?/schema",
    "teistro-render-svg?/schema",
    "teistro-research?/schema",
    "teistro-rules?/schema",
    "teistro-serial?/schema",
    "teistro-strength?/schema",
    "teistro-tajika?/schema",
    "teistro-western?/schema",
]
builtin-ephemeris = ["dep:teistro-ephemeris-builtin"]
builtin-compact = ["builtin-ephemeris", "teistro-ephemeris-builtin/compact"]
builtin-standard = ["builtin-ephemeris", "teistro-ephemeris-builtin/standard"]
builtin-full = ["builtin-ephemeris", "teistro-ephemeris-builtin/full"]

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
# Signs the test packs with a key made in the test; the SDK embeds none.
ed25519-dalek = { version = "3", default-features = false }
jiff-tzdb = "0.1"
teistro-state = { path = "../state" }
teistro-test-allocator = { path = "../test-allocator" }

[lints]
workspace = true

# Every target that names `Ephemeris::Builtin` declares the feature the
# variant lives behind. Without this a `--no-default-features` build of
# this crate **fails** on those targets rather than skipping them, which
# is not what a tier build is asking for -- and it did, unnoticed,
# because nothing had ever built this crate without its default.
# `check-lints`' `target-declares-the-feature-it-needs` holds the class
# by reading the sources, so a target that stops naming the built-in
# stops needing the line and one that starts cannot be added without it.
#
# `calendars` and `parity` are absent on purpose: the first names
# `Ephemeris::None` (a calendar needs no ephemeris, which is its lesson)
# and the second `Ephemeris::Test`. Neither is gated.

