[package]
name = "teistro-kp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Teistro SDK's Krishnamurti Paddhati: the star, sub and deeper lords of any longitude, exactly, and the 249 horary numbers"
readme = "README.md"
# Publishes at the first release, never on a phase boundary
# (docs/06-cicd/03-release-process.md).
publish = false

[features]
# Derives `schemars::JsonSchema` on every type this crate serialises,
# so the agent server states its tools' answers (`03-design/mcp-server.md`
# §7, P1).
schema = ["dep:schemars", "teistro-aspect/schema", "teistro-core/schema", "teistro-dasha/schema"]

[dependencies]
teistro-aspect = { path = "../aspect" }
teistro-core = { path = "../core" }
teistro-dasha = { path = "../dasha" }
serde = { version = "1", features = ["derive"] }
schemars = { version = "1.2", optional = true }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
