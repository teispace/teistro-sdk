publish = false

[dependencies]
teistro-aspect = { path = "../aspect" }
teistro-core = { path = "../core" }
teistro-dasha = { path = "../dasha" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
