[package]
name = "teistro-kp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Teistro SDK's Krishnamurti Paddhati: the star, sub and deeper lords of any longitude, exactly, and the 249 horary numbers"
