[package]
name = "teistro-render-svg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Teistro SDK's first-party chart renderer: a placed chart, its labels and a theme to a byte-stable SVG"
readme = "README.md"
# Publishes at the first release, never on a phase boundary
# (docs/06-cicd/03-release-process.md).
publish = false

[features]
# Derives `schemars::JsonSchema` on the theme and the labels, so a consumer
# who stores a theme can check it (`docs/03-design/render-svg.md`).
schema = ["dep:schemars", "teistro-core/schema", "teistro-geometry/schema"]

[dependencies]
teistro-core = { path = "../core", version = "=1.0.0-rc.1" }
teistro-geometry = { path = "../geometry", version = "=1.0.0-rc.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.2", optional = true }

[dev-dependencies]
roxmltree = "0.21"
teistro-chart = { path = "../chart" }

[lints]
workspace = true
