[package]
name = "teistro-idl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Teistro SDK API description: the model every binding is generated from, the C layout rules, the result blob encoding, the extractor over the boundary crates and the emitters"
readme = "README.md"
keywords = ["ffi", "bindings", "idl", "astrology"]
categories = ["development-tools::ffi"]
# The name is held on crates.io — a 0.0.0 placeholder published
# 2026-09-10 — and this crate publishes for real at the first
# release, never on a phase boundary
# (docs/06-cicd/03-release-process.md).
publish = false

[features]
# The extractor parses Rust source with `syn`; a crate that only declares
# blob schemas (the C ABI crate) leaves it off.
default = ["extract"]
extract = ["dep:syn", "dep:proc-macro2"]

[dependencies]
proc-macro2 = { version = "1", optional = true, features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
# The validator corpus is written from a `Value`, whose keys keep the
# order they were written in only under `preserve_order`. Every build
# with `teistro-intl` has it on already; asking for it here makes this
# crate's output its own rather than its neighbours' (the corpus came out
# sorted, and unlike its checked-in file, when this crate was built alone).
serde_json = { version = "1", features = ["preserve_order"] }
syn = { version = "2", optional = true, features = ["full", "extra-traits", "parsing"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
# Each is used where the tool cannot see it.
# proc-macro2: enables `span-locations` for syn.
ignored = ["proc-macro2"]
