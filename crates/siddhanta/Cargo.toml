[package]
name = "teistro-siddhanta"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Teistro SDK: the Surya Siddhanta as a computation model and an ephemeris provider, with mean motions, apsides and nodes, the sine table, the manda and sighra equations, daily motions, latitudes, declination, ascensional difference, the horoscope point and the text's precession"
readme = "README.md"
keywords = ["surya-siddhanta", "astrology", "jyotisha", "panchanga"]
categories = ["science"]
# Not published until the Phase 1 exit (docs/07-roadmap/00-roadmap.md).
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
teistro-astro = { path = "../astro" }
teistro-core = { path = "../core" }
teistro-port-ephemeris = { path = "../port-ephemeris" }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
proptest = "1"
serde_json = "1"
# The Gregorian conversion for the committee's printed dates; the
# calendars consume this crate at runtime, never the reverse.
teistro-calendar = { path = "../calendar" }
teistro-ephemeris-kit = { path = "../ephemeris-kit" }

[[bench]]
name = "siddhanta"
harness = false

[lints]
workspace = true
