[package]
name = "teistro-scenario"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The fixed scenario the SDK measures itself with: what the determinism matrix hashes and what the instruction-count benchmarks count"
# Never published: this is the SDK's own test scaffolding. The name
# is held on crates.io all the same (0.0.0, 2026-09-10) so no one
# else can publish under a `teistro-` name that looks like ours.
publish = false

[dependencies]
teistro-astro = { path = "../astro", version = "=1.0.0-rc.4" }
teistro-calendar = { path = "../calendar", version = "=1.0.0-rc.4" }
teistro-chart = { path = "../chart", version = "=1.0.0-rc.4" }
teistro-core = { path = "../core", version = "=1.0.0-rc.4" }
teistro-dasha = { path = "../dasha", version = "=1.0.0-rc.4" }
# The built-in ephemeris at its default tier, for the sections whose cost
# is the built-in's own caching over a range (festivals, muhurta, a year).
teistro-ephemeris-builtin = { path = "../ephemeris-builtin", version = "=1.0.0-rc.4" }
teistro-geometry = { path = "../geometry", version = "=1.0.0-rc.4" }
teistro-muhurta = { path = "../muhurta", version = "=1.0.0-rc.4" }
teistro-render-svg = { path = "../render-svg", version = "=1.0.0-rc.4" }
teistro-panchanga = { path = "../panchanga", version = "=1.0.0-rc.4" }
teistro-port-ephemeris = { path = "../port-ephemeris", version = "=1.0.0-rc.4" }
teistro-siddhanta = { path = "../siddhanta", version = "=1.0.0-rc.4" }
# The façade, for what only it composes (transit hits, Sade Sati) and what
# a chart is read for (strengths, gochar, matching, Tajika), asked through
# its own record as a consumer asks them.
teistro = { path = "../sdk", version = "=1.0.0-rc.4" }
serde_json = "1"

[lints]
workspace = true
