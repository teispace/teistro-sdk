[package]
name = "teistro-astro"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Teistro SDK astronomy layer: Delta T and the time scales, the IAU routines ported from ERFA, sidereal time, frame completion over the ephemeris port, the shared boundary solver and the rise and set solver"
readme = "README.md"
keywords = ["astronomy", "ephemeris", "astrology"]
categories = ["science"]
# The name is held on crates.io — a 0.0.0 placeholder published
# 2026-09-10 — and this crate publishes for real at the first
# release, never on a phase boundary
# (docs/06-cicd/03-release-process.md).
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
teistro-core = { path = "../core" }
teistro-port-ephemeris = { path = "../port-ephemeris" }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
teistro-test-allocator = { path = "../test-allocator" }
proptest = "1"
serde_json = "1"

[[bench]]
name = "astro"
harness = false

[lints]
workspace = true
