[package]
name = "teistro-ephemeris-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Teistro SDK provider conformance kit: the checks every ephemeris provider passes under one published set of bounds, the report, the timing rows and the runner the kit binaries share"
readme = "README.md"
keywords = ["ephemeris", "conformance", "astrology"]
categories = ["science"]
# The name is held on crates.io — a 0.0.0 placeholder published
# 2026-09-10 — and this crate publishes for real at the first
# release, never on a phase boundary
# (docs/06-cicd/03-release-process.md).
publish = false

[[bin]]
name = "teistro-ephemeris-kit"
path = "src/bin/kit.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The façade, for the two checks that found a chart. Without its default
# features, so a kit run never brings a built-in tier with it: the tier a
# test measures is the one that test compiled.
teistro = { path = "../sdk", default-features = false }
teistro-astro = { path = "../astro" }
teistro-core = { path = "../core" }
teistro-port-ephemeris = { path = "../port-ephemeris" }

[lints]
workspace = true
