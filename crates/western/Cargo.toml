[package]
name = "teistro-western"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Teistro SDK's modern Western doctrine: progressions and directions, the measures that match the sky's time to a life's"
readme = "README.md"
# Publishes at the first release, never on a phase boundary
# (docs/06-cicd/03-release-process.md).
publish = false

[features]
# Derives `schemars::JsonSchema` on every type this crate serialises,
# so the agent server states its tools' answers (`03-design/mcp-server.md`
# §7, P1).
schema = ["dep:schemars", "teistro-aspect/schema", "teistro-astro/schema", "teistro-core/schema", "teistro-gochar/schema"]

[dependencies]
teistro-aspect = { path = "../aspect" }
teistro-astro = { path = "../astro" }
teistro-core = { path = "../core" }
teistro-gochar = { path = "../gochar" }
serde = { version = "1", features = ["derive"] }
schemars = { version = "1.2", optional = true }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
