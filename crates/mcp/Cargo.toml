[package]
name = "teistro-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Teistro SDK as tools an agent calls: a Model Context Protocol server over stdio, answering every record entry point of the Rust façade with its provenance"
readme = "README.md"
# Packaged with the release (`03-design/mcp-server.md` §6, step 4), never
# on a phase boundary. The build script reads `idl/api.json` from the
# repository, which a published crate would have to carry.
publish = false

[[bin]]
name = "teistro-mcp"
path = "src/main.rs"

[dependencies]
teistro = { path = "../sdk", features = ["schema"] }
teistro-core = { path = "../core", features = ["schema"] }
teistro-idl = { path = "../idl", default-features = false }
teistro-port-ephemeris = { path = "../port-ephemeris", features = ["load"] }
serde = "1"
serde_json = "1"
schemars = "1.2"

# A task id's randomness, and the thread a task runs on, are the host's:
# a wasm32 server makes no tasks.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
getrandom = "0.3"

[dev-dependencies]
boon = "0.6"
teistro-test-adapter = { path = "../test-adapter" }

[build-dependencies]
serde_json = "1"
getrandom = "0.3"

# The binary loads the adapter `--plugin` names, which is one `unsafe`
# call with its SAFETY comment (`src/main.rs`); unsafe is `deny` rather
# than the workspace's `forbid` here, and the rest of the workspace table
# is kept.
[lints.rust]
# verify's coverage job measures shipped code only: cargo-llvm-cov sets
# `coverage_nightly` on the nightly, under which every test module is
# `coverage(off)` (`xtask/src/coverage.rs`).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unimplemented = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
indexing_slicing = "warn"
