[package]
name = "teistro-calendar"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Teistro SDK calendars: the fixed day, Gregorian, Julian, mixed and ISO week arithmetic, and Bikram Sambat over its table"
readme = "README.md"
keywords = ["calendar", "bikram-sambat", "gregorian", "julian"]
categories = ["date-and-time"]
# Not published until the Phase 1 exit (docs/07-roadmap/00-roadmap.md).
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
teistro-core = { path = "../core" }

[dev-dependencies]
# The differential oracle for the arithmetic calendars (Unicode/ICU4X; Apache-2.0).
calendrical_calculations = "0.2"
proptest = "1"
serde_json = "1"

[lints]
workspace = true
