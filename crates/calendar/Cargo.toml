[package]
name = "teistro-calendar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Teistro SDK calendars: the fixed day, Gregorian, Julian, mixed and ISO week arithmetic, Bikram Sambat over its table, and the solar-calendar engine that computes it from the Surya Siddhanta or from modern astronomy through the ephemeris port"
readme = "README.md"
keywords = ["calendar", "bikram-sambat", "gregorian", "julian"]
categories = ["date-and-time"]
# The name is held on crates.io — a 0.0.0 placeholder published
# 2026-09-10 — and this crate publishes for real at the first
# release, never on a phase boundary
# (docs/06-cicd/03-release-process.md).
publish = false

[features]
# Derives `schemars::JsonSchema` on the types a chart document carries,
# so `cargo xtask gen document-schema` can describe it
# (`docs/03-design/document-schema.md`).
schema = ["dep:schemars", "teistro-astro/schema", "teistro-core/schema", "teistro-port-ephemeris/schema", "teistro-siddhanta/schema"]

[dependencies]
serde = { version = "1", features = ["derive"] }
teistro-astro = { path = "../astro" }
teistro-core = { path = "../core" }
teistro-port-ephemeris = { path = "../port-ephemeris" }
teistro-siddhanta = { path = "../siddhanta" }
schemars = { version = "1.2", optional = true }

[dev-dependencies]
teistro-test-allocator = { path = "../test-allocator" }
# The differential oracle for the arithmetic calendars (Unicode/ICU4X; Apache-2.0).
calendrical_calculations = "0.2"
proptest = "1"
serde_json = "1"
# Nepal's clock history for the Bikram Sambat engine's tests; the time
# layer consumes the calendars at runtime, never the reverse.
teistro-time = { path = "../time" }

[lints]
workspace = true
