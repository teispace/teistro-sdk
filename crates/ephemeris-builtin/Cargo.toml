[package]
name = "teistro-ephemeris-builtin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Teistro SDK's built-in analytic ephemeris: the published planetary and lunar series, so a chart computes with no data files, no network and no licence beyond the SDK's own"
readme = "README.md"
keywords = ["astrology", "ephemeris", "vsop87", "astronomy"]
categories = ["science", "aerospace"]
# The name is held on crates.io — a 0.0.0 placeholder published
# 2026-09-10 — and this crate publishes for real at the first
# release, never on a phase boundary
# (docs/06-cicd/03-release-process.md).
publish = false

[features]
default = ["standard"]

# The three tiers of ADR-0008, with the bounds ADR-0027 fixed. Exactly
# one belongs in a binary: a consumer who takes `compact` should pay for
# `compact`, which is the whole point of having a tier on a platform that
# counts kilobytes.
#
# `compact` is one arcminute in about 80 KB, for wasm and mobile.
# `standard` is the default: an arcsecond of truncation in about 500 KB.
# `full` is the theories as published, for research and for the second
# oracle the astronomy layer's own tests use.
compact = []
standard = []
full = []

# Reading the published source files is the generator's job, not the
# shipped crate's: a consumer receives truncated tables and never a
# parser for 8 MB of text. `cargo xtask vsop`, `ephemgen` and the
# adapter's floor measurements turn it on; nothing else does.
ingest = []

[dependencies]
teistro-astro = { path = "../astro" }
teistro-core = { path = "../core" }
teistro-port-ephemeris = { path = "../port-ephemeris" }

[dev-dependencies]
teistro-ephemeris-kit = { path = "../ephemeris-kit" }

[lints]
workspace = true
