[package]
name = "teistro-rules"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Teistro SDK's rules kernel: a condition language over a chart, evaluated to presences with their participants"
readme = "README.md"
# Claimed on crates.io at the release, as every module is
# (docs/06-cicd/03-release-process.md).
publish = false

[features]
# Derives `schemars::JsonSchema` on every type this crate serialises,
# so the agent server states its tools' answers (`03-design/mcp-server.md`
# §7, P1).
schema = ["dep:schemars", "teistro-aspect/schema", "teistro-core/schema", "teistro-dasha/schema", "teistro-points/schema", "teistro-state/schema", "teistro-strength/schema"]

[dependencies]
teistro-aspect = { path = "../aspect", version = "=1.0.0-rc.1" }
teistro-core = { path = "../core", version = "=1.0.0-rc.1" }
teistro-dasha = { path = "../dasha", version = "=1.0.0-rc.1" }
teistro-points = { path = "../points", version = "=1.0.0-rc.1" }
teistro-state = { path = "../state", version = "=1.0.0-rc.1" }
teistro-strength = { path = "../strength", version = "=1.0.0-rc.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.2", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
serde_json = "1"
teistro-test-allocator = { path = "../test-allocator" }
teistro-vargas = { path = "../vargas" }

[lints]
workspace = true

[[bench]]
name = "rules"
harness = false
