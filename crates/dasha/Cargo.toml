[package]
name = "teistro-dasha"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Teistro SDK's dashas: systems as rows over a kernel, the balance at birth, and the period tree read without materialising it"
readme = "README.md"
# Publishes at the first release, never on a phase boundary
# (docs/06-cicd/03-release-process.md).
publish = false

[features]
# Derives `schemars::JsonSchema` on the types a chart document carries,
# so `cargo xtask gen document-schema` can describe it
# (`docs/03-design/document-schema.md`).
schema = ["dep:schemars", "teistro-core/schema"]

[dependencies]
teistro-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
schemars = { version = "1.2", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
serde_json = "1"
teistro-test-allocator = { path = "../test-allocator" }

[lints]
workspace = true

[[bench]]
name = "dasha"
harness = false
