[package]
name = "teistro-chart"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Teistro SDK's chart foundation: the day a chart belongs to, its bhavas with their madhya and sandhi, and where each graha falls in them"
readme = "README.md"
# The name is held on crates.io — a 0.0.0 placeholder published
# 2026-09-10 — and this crate publishes for real at the first
# release, never on a phase boundary
# (docs/06-cicd/03-release-process.md).
publish = false

[features]
# Derives `schemars::JsonSchema` on the types a chart document carries,
# so `cargo xtask gen document-schema` can describe it
# (`docs/03-design/document-schema.md`).
schema = ["dep:schemars", "teistro-astro/schema", "teistro-calendar/schema", "teistro-core/schema", "teistro-port-ephemeris/schema", "teistro-time/schema"]

[dependencies]
teistro-astro = { path = "../astro" }
teistro-calendar = { path = "../calendar" }
teistro-core = { path = "../core" }
teistro-port-ephemeris = { path = "../port-ephemeris" }
teistro-time = { path = "../time" }
serde = { version = "1", features = ["derive"] }
schemars = { version = "1.2", optional = true }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
