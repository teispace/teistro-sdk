[package]
name = "teistro-chart"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Teistro SDK's chart foundation: the day a chart belongs to, its bhavas with their madhya and sandhi, and where each graha falls in them"
readme = "README.md"
# The name is held on crates.io — a 0.0.0 placeholder published
# 2026-09-10 — and this crate publishes for real at the first
# release, never on a phase boundary
# (docs/06-cicd/03-release-process.md).
publish = false

[dependencies]
teistro-astro = { path = "../astro" }
teistro-calendar = { path = "../calendar" }
teistro-core = { path = "../core" }
teistro-port-ephemeris = { path = "../port-ephemeris" }
teistro-time = { path = "../time" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
