[package]
name = "teistro-prashna"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Teistro SDK's prashna: the query chart read as Shatpanchashika prints it"
readme = "README.md"
# Publishes at the first release, never on a phase boundary
# (docs/06-cicd/03-release-process.md).
publish = false

[features]
# Derives `schemars::JsonSchema` on the types an answer carries, so
# `cargo xtask gen document-schema` can describe it
# (`docs/03-design/document-schema.md`).
schema = ["dep:schemars", "teistro-core/schema", "teistro-aspect/schema", "teistro-tajika/schema"]

[dependencies]
teistro-aspect = { path = "../aspect" }
teistro-core = { path = "../core" }
teistro-tajika = { path = "../tajika" }
serde = { version = "1", features = ["derive"] }
schemars = { version = "1.2", optional = true }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
