[package]
name = "teistro-port-ephemeris"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Teistro SDK ephemeris port: positions required and overrides declared; the request over a grid, the columnar response, frames, capabilities, the C vtable and the analytic test provider"
readme = "README.md"
keywords = ["ephemeris", "astronomy", "astrology"]
categories = ["science"]
# Not published until the Phase 1 exit (docs/07-roadmap/00-roadmap.md).
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
teistro-core = { path = "../core" }

[dev-dependencies]
serde_json = "1"

# The vtable module is the port's C shape and holds this crate's only
# unsafe code, one SAFETY comment per block; unsafe is `deny` rather than
# the workspace's `forbid` here, and the rest of the workspace table is
# kept (docs/04-implementation/README.md, coding standards).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unimplemented = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
indexing_slicing = "warn"
