[package]
name = "teistro-aspect"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Teistro SDK's drishti: the graha drishti, the Jaimini rashi drishti, conjunction and the orb engine"
readme = "README.md"
# The name is held on crates.io — a 0.0.0 placeholder published
# 2026-09-10 — and this crate publishes for real at the first
# release, never on a phase boundary
# (docs/06-cicd/03-release-process.md).
publish = false

[dependencies]
teistro-chart = { path = "../chart" }
teistro-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
teistro-astro = { path = "../astro" }
teistro-calendar = { path = "../calendar" }
teistro-port-ephemeris = { path = "../port-ephemeris" }

[lints]
workspace = true
