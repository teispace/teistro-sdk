[package]
name = "teistro-serial"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Teistro SDK's canonical form: the seal, the number grammar two bindings agree on, and the chart document"
readme = "README.md"
# The name is held on crates.io — a 0.0.0 placeholder published
# 2026-09-10 — and this crate publishes for real at the first
# release, never on a phase boundary
# (docs/06-cicd/03-release-process.md).
publish = false

[features]
# Derives `schemars::JsonSchema` on the types a chart document carries,
# so `cargo xtask gen document-schema` can describe it
# (`docs/03-design/document-schema.md`).
schema = ["dep:schemars", "teistro-aspect/schema", "teistro-chart/schema", "teistro-core/schema", "teistro-dasha/schema", "teistro-geometry/schema", "teistro-houses/schema", "teistro-matching/schema", "teistro-strength/schema", "teistro-panchanga/schema", "teistro-points/schema", "teistro-state/schema", "teistro-vargas/schema"]

[dependencies]
teistro-aspect = { path = "../aspect", version = "=1.0.0-rc.4" }
teistro-calendar = { path = "../calendar", version = "=1.0.0-rc.4" }
teistro-chart = { path = "../chart", version = "=1.0.0-rc.4" }
teistro-core = { path = "../core", version = "=1.0.0-rc.4" }
teistro-dasha = { path = "../dasha", version = "=1.0.0-rc.4" }
teistro-geometry = { path = "../geometry", version = "=1.0.0-rc.4" }
teistro-houses = { path = "../houses", version = "=1.0.0-rc.4" }
teistro-matching = { path = "../matching", version = "=1.0.0-rc.4" }
teistro-panchanga = { path = "../panchanga", version = "=1.0.0-rc.4" }
teistro-points = { path = "../points", version = "=1.0.0-rc.4" }
teistro-strength = { path = "../strength", version = "=1.0.0-rc.4" }
teistro-state = { path = "../state", version = "=1.0.0-rc.4" }
teistro-vargas = { path = "../vargas", version = "=1.0.0-rc.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.2", optional = true }

[dev-dependencies]
# A draft 2020-12 validator for the schema gate; no network, no runtime
# dependencies, and a test-only one (`docs/03-design/document-schema.md` §5).
boon = "0.6"
teistro-astro = { path = "../astro" }
teistro-calendar = { path = "../calendar" }
teistro-port-ephemeris = { path = "../port-ephemeris" }

[lints]
workspace = true
