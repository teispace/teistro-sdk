[package]
name = "teistro-serial"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Teistro SDK's canonical form: the seal, the number grammar two bindings agree on, and the chart document"
readme = "README.md"
# The name is held on crates.io — a 0.0.0 placeholder published
# 2026-09-10 — and this crate publishes for real at the first
# release, never on a phase boundary
# (docs/06-cicd/03-release-process.md).
publish = false

[dependencies]
teistro-aspect = { path = "../aspect" }
teistro-chart = { path = "../chart" }
teistro-core = { path = "../core" }
teistro-houses = { path = "../houses" }
teistro-panchanga = { path = "../panchanga" }
teistro-points = { path = "../points" }
teistro-state = { path = "../state" }
teistro-vargas = { path = "../vargas" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
teistro-astro = { path = "../astro" }
teistro-calendar = { path = "../calendar" }
teistro-port-ephemeris = { path = "../port-ephemeris" }

[lints]
workspace = true
