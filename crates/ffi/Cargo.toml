[package]
name = "teistro-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Teistro SDK C ABI: the one audited boundary every binding is generated against (contexts, calendars, time, keys, intl and positions over the ephemeris port, with the result blob)"
readme = "README.md"
keywords = ["ffi", "c-abi", "astrology"]
categories = ["development-tools::ffi"]
# The name is held on crates.io — a 0.0.0 placeholder published
# 2026-09-10 — and this crate publishes for real at the first
# release, never on a phase boundary
# (docs/06-cicd/03-release-process.md).
publish = false

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Rust consumer surface, which composes the crates this boundary
# used to compose itself (`03-design/rust-consumer-surface.md` §3). The
# boundary keeps what only a C caller needs -- the handles, the
# `struct_size` handshake, the blob writer, the panic guard, the
# `last_error` slot -- and the composition has one home.
teistro = { path = "../sdk", default-features = false }
teistro-aspect = { path = "../aspect" }
teistro-astro = { path = "../astro" }
teistro-calendar = { path = "../calendar" }
teistro-chart = { path = "../chart" }
teistro-core = { path = "../core" }
teistro-houses = { path = "../houses" }
teistro-idl = { path = "../idl", default-features = false }
teistro-intl = { path = "../intl", default-features = false }
teistro-panchanga = { path = "../panchanga" }
teistro-port-ephemeris = { path = "../port-ephemeris" }
teistro-serial = { path = "../serial" }
teistro-geometry = { path = "../geometry" }
teistro-state = { path = "../state" }
teistro-vargas = { path = "../vargas" }
teistro-time = { path = "../time" }

# The plugin loader (ADR-0029), which a wasm build has no use for: a wasm
# module cannot open a shared library, so there it has the built-in and a
# host provider, and `src/provider.rs` is compiled out.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
libloading = "0.8"

# The SDK's own ephemeris, so a consumer who installs nothing else still
# computes a chart (ADR-0008, ADR-0028). It is a feature because a shared
# library cannot be tree-shaken: a consumer who brings their own provider
# and counts kilobytes turns it off and keeps the vtable path.
#
# A tier is additive and the richest wins, which is the built-in crate's
# own rule, so asking for `builtin-full` beside the default leaves `full`
# in force rather than a conflict.
[features]
default = ["builtin-standard"]
# Forwarded to the façade, which is where the built-in is now reached
# from: the boundary no longer holds that crate, so a tier is a feature
# of one crate rather than of two that could disagree.
#
# Each tier turns on `builtin-ephemeris` here as well as forwarding, the
# way the façade's own tiers do. Forwarding alone left this crate's
# `#[cfg(feature = "builtin-ephemeris")]` off while the façade underneath
# had a built-in, so `ts_context_new` refused `TsEphemeris::Builtin` as
# `UNSUPPORTED` — a library built at a tier that could not be asked for
# the tier it was built at.
# The built-in at whatever tier the features below name; alone it names
# none, and the built-in crate refuses to build without one.
builtin-ephemeris = ["teistro/builtin-ephemeris"]
builtin-compact = ["builtin-ephemeris", "teistro/builtin-compact"]
builtin-standard = ["builtin-ephemeris", "teistro/builtin-standard"]
builtin-full = ["builtin-ephemeris", "teistro/builtin-full"]


[dev-dependencies]
teistro-idl = { path = "../idl" }

# The one crate that may hold unsafe code: the C boundary. The workspace
# forbids it everywhere else; here it is `deny` so that each module that
# crosses the boundary allows it explicitly, and every block carries a
# SAFETY comment (docs/05-testing/01-quality-bar.md, "unsafe confinement").
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unimplemented = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
indexing_slicing = "warn"
