[package]
name = "teistro-test-allocator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A global allocator that counts what the calling thread allocates, so a test can assert how many times a hot path allocates"
publish = false

[dependencies]

# A global allocator is an `unsafe` trait, so this crate denies rather
# than forbids and allows it on the one impl with its SAFETY argument;
# the rest of the workspace table is kept. It is test-only and never
# published (`docs/05-testing/01-quality-bar.md`, allocation counts).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unimplemented = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
indexing_slicing = "warn"
missing_docs_in_private_items = "warn"
