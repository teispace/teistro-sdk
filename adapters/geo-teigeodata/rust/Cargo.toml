[package]
name = "teistro-geo-teigeodata"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
# teigeodata is Apache-2.0 too, so the built library is: unlike the
# ephemeris adapters, nothing downstream of this crate changes its licence.
# The packs it reads carry their sources' own terms in their manifests
# (`Layer::attribution`), which an application shows where it shows the data.
license = "Apache-2.0"
publish = false
description = "The teigeodata adapter of the Teistro SDK's geo port: a place's IANA zone, ground height and ISO 3166 admin units from teigeodata packs, outside the SDK workspace (ADR-0019)"

# What a gate needs to know of the engine that this directory's layout
# cannot say (`docs/06-cicd/adapter-gate.md`). `check-adapter` holds an
# ephemeris adapter to the provider kit and loads it as a plugin; a geo
# adapter has neither, so this one is gated by its own tests
# (`../README.md`).
[package.metadata.teistro-adapter]
engine = "teigeodata"
# The teigeodata checkout beside the SDK, where the tests read its built
# packs unless `TEISTRO_TEIGEODATA_PACKS` names others.
engine-checkout = "../../../../../geodata"

# Standalone on purpose: the adapter depends on the SDK, never the
# reverse, and the SDK workspace builds without it.
[workspace]

[features]
# The native set: packs opened as mapped files (`open`), the place
# catalogue's search (`search`), terrain heights (`terrain`) and the zone
# rules (`zone-rules`). Every set answers the zone, the admin units, the
# names, the nearest places and the listings: they need no feature.
default = ["mmap", "search", "terrain", "zone-rules"]
# `TeigeodataGeo::open`: pack files mapped with `memmap2`. Native targets
# only; the web reads packs into memory (`from_bytes`).
mmap = ["teigeodata-engine/mmap"]
# `GeoProvider::search`: a name to places, across scripts, ranked as
# teigeodata ranks (exact, loose, prefix, fuzzy, substring, phonetic, a
# named parent after a comma, a focus point). Without it a search is
# refused as `CAPABILITY` on `search`; teigeodata's own `wasm-lookup`
# leaves it out the same way.
search = ["teigeodata-engine/search", "teigeodata-engine/substring"]
# `GeoProvider::height_at` from a pack's DEM or its coarse grid. Without
# it a point answers no height.
terrain = ["teigeodata-engine/dem", "teigeodata-engine/dem-coarse"]
# `GeoProvider::time_zones`: the packs' own zone rules. Without it the
# provider hands over none.
zone-rules = ["teigeodata-engine/tz-rules"]
# The size probe's baseline (`examples/size.rs`): the same program over an
# empty `GeoTable`, so the difference is what the adapter adds.
probe-baseline = []

[dependencies]
# The engine at v1.2.0, with what every feature set reads: the admin
# hierarchy and its outlines (`admin`, `admin-index`), the names a place
# is called by in each language and script (`names`), the timezone areas
# (`timezone`, `timezone-index`), each place's population (`extra`), and
# `Shared`, the engine teigeodata's store fills and refills while queries
# run (`shared`). The features above add the rest. Packs of format 1
# (teigeodata's data releases from `data-2026.11.15`) need a reader at
# v1.0.0 or later; this one also reads the earlier formats.
teigeodata-engine = { git = "https://github.com/teispace/teigeodata", tag = "v1.2.0", default-features = false, features = [
  "admin",
  "admin-index",
  "names",
  "timezone",
  "timezone-index",
  "extra",
  "shared",
] }
# The engine's grid point, from the same tag.
teigeodata-core = { git = "https://github.com/teispace/teigeodata", tag = "v1.2.0" }
# The pack format's place flags (`places::FLAG_FORMER`, a former unit),
# which the engine reports and does not name; already in the engine's graph.
teigeodata-format = { git = "https://github.com/teispace/teigeodata", tag = "v1.2.0", default-features = false }
teistro-core = { path = "../../../crates/core" }
teistro-port-geo = { path = "../../../crates/port-geo" }
teistro-port-timezone = { path = "../../../crates/port-timezone" }

[dev-dependencies]
serde_json = "1"
# The SDK's façade, for the acceptance test that runs the SDK's own geo
# suite over this provider: a context built with it resolves a place, a
# chart founded on that place keeps it in its receipt, and the receipt
# replays without the provider.
teistro = { path = "../../../crates/sdk", default-features = false, features = [
  "builtin-compact",
  "chart",
] }

# The same table as the SDK workspace; a standalone crate cannot inherit
# it. This adapter holds no `unsafe` code: the engine maps its files in its
# own crate.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unimplemented = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
indexing_slicing = "warn"

# See the SDK workspace's own `[profile.dev]` for the reasoning. This root
# is excluded from that workspace (ADR-0019) and has its own target
# directory, so it needs the settings again, and it turns incremental off
# besides, as the other adapters do.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

# The size probe's profile (`examples/size.rs`, §13.3 of the design): as a
# consumer ships, small and stripped, as teigeodata's own wasm profile is.
[profile.size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The tests open pack files (`mmap`); a lookup-only build is checked by
# building it (`docs/03-design/geo-port.md` §13.3), not by these.
[[test]]
name = "catalogue"
required-features = ["mmap", "search", "zone-rules"]

[[test]]
name = "kathmandu"
required-features = ["mmap", "zone-rules"]

[[test]]
name = "sdk"
required-features = ["mmap"]

[[test]]
name = "zones"
required-features = ["mmap", "zone-rules"]
