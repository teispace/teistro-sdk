name: teistro_ephemeris_teimeris_flutter
description: >-
  The Teimeris ephemeris in a Flutter app: a build hook that bundles the
  Teimeris adapter, built with the engine's data inside it, for every
  Android ABI and iOS SDK the app is built for, and a `teimeris()` that
  opens it with no path and no files.
version: 0.0.0
publish_to: none
repository: https://github.com/teispace/teistro-sdk

# AGPL-3.0-only, because the library this package bundles links Teimeris
# (ADR-0029); the SDK it extends stays Apache-2.0 and loads it at run time.
environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^2.0.0
  hooks: ^2.2.0
  # The SDK's own bundler: this package's hook is `bundlePrebuilt` with the
  # adapter's release, so the floors, the platforms, the digest check and
  # the user defines are one implementation, not two.
  teistro_flutter:
    path: ../../../bindings/flutter
  teistro:
    path: ../../../bindings/dart
  teistro_ephemeris_teimeris:
    path: ../dart

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
