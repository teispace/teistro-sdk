# Held to the same lints and strictness as the packages it builds on.
include: package:lints/recommended.yaml

analyzer:
  # The example is a Flutter app with its own pubspec, which only
  # `flutter pub get` resolves; this package's own gate is plain Dart.
  exclude:
    - example/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
