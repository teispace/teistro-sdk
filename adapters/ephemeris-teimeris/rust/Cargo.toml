[package]
name = "teistro-ephemeris-teimeris"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "The Teimeris adapter of the Teistro SDK's ephemeris port, outside the SDK workspace (ADR-0019); links Teimeris under Teimeris's own terms"

# Standalone on purpose: the adapter depends on the SDK, never the
# reverse, and the SDK workspace builds without it.
[workspace]


# The built-in ephemeris's tiers, forwarded. The floor and agreement
# binaries measure whichever tier is compiled in, and a tier is a feature,
# so without these the measurement could only ever be taken of the
# default one -- and `03-design/completion-measured.md` would be printing
# a command that did nothing.
#
# Additive like any feature: enabling `full` beside the default leaves the
# richest enabled tier in force, which is what the builtin crate's own
# cfg does.
[features]
default = ["standard"]
compact = ["teistro-ephemeris-builtin/compact"]
standard = ["teistro-ephemeris-builtin/standard"]
full = ["teistro-ephemeris-builtin/full"]

[[bin]]
name = "teistro-ephemeris-teimeris-kit"
path = "src/bin/kit.rs"

[[bin]]
name = "teistro-ephemeris-teimeris-bs-fit"
path = "src/bin/bs_fit.rs"

[[bin]]
name = "teistro-ephemeris-teimeris-ayanamsha-table"
path = "src/bin/ayanamsha_table.rs"

[[bin]]
name = "teistro-ephemeris-teimeris-houses-table"
path = "src/bin/houses_table.rs"

[[bin]]
name = "teistro-ephemeris-teimeris-stars-table"
path = "src/bin/stars_table.rs"

[[bin]]
name = "teistro-ephemeris-teimeris-pheno-table"
path = "src/bin/pheno_table.rs"

[[bin]]
name = "teistro-ephemeris-teimeris-pluto-fit"
path = "src/bin/pluto_fit_table.rs"

[[bin]]
name = "teistro-ephemeris-teimeris-stack-agreement"
path = "src/bin/stack_agreement_table.rs"

[[bin]]
name = "teistro-ephemeris-teimeris-moon-floor"
path = "src/bin/moon_floor_table.rs"

[[bin]]
name = "teistro-ephemeris-teimeris-vsop-floor"
path = "src/bin/vsop_floor_table.rs"

[[bin]]
name = "teistro-ephemeris-teimeris-sidereal-table"
path = "src/bin/sidereal_table.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teimeris = { path = "../../../../teimeris/bindings/rust/teimeris" }
teistro-astro = { path = "../../../crates/astro" }
teistro-calendar = { path = "../../../crates/calendar" }
teistro-core = { path = "../../../crates/core" }
teistro-ephemeris-builtin = { path = "../../../crates/ephemeris-builtin", default-features = false, features = [
  "ingest",
] }
teistro-ephemeris-kit = { path = "../../../crates/ephemeris-kit" }
teistro-port-ephemeris = { path = "../../../crates/port-ephemeris" }
teistro-siddhanta = { path = "../../../crates/siddhanta" }
teistro-time = { path = "../../../crates/time" }

[dev-dependencies]
serde_json = "1"

# The same table as the SDK workspace; a standalone crate cannot inherit it.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unimplemented = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
indexing_slicing = "warn"
