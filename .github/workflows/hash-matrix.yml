# The cross-architecture hash matrix: the same source computes the same
# numbers, or it says where it does not and by how much.
#
# `cargo xtask hashes` walks a fixed scenario through the calendars, the
# astronomy, the house systems and the classical model, hashes every
# value's bits per section, and writes every value out;
# `cargo xtask compare-hashes` says how many values differ and by how many
# units in the last place. This workflow runs both across the platforms we
# ship for.
#
# Phase 1's exit criterion is x86-64 against aarch64, which is the same C
# library on two architectures: that comparison fails the job. macOS is
# another C library, and its maths functions round differently in the last
# place; that comparison is reported rather than failed, because a nightly
# that is always red teaches people to ignore it. The measurement is in
# `docs/05-testing/01-quality-bar.md`.
#
# It runs nightly and on demand rather than on every push: the fast check
# stays fast (ADR-0014), and a difference here is a property of the
# toolchain and the platform's maths library, not of a pull request.
name: hash-matrix

on:
  workflow_dispatch:
  schedule:
    # Nightly, after the day's merges.
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  digest:
    name: digest (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux-x86_64
          - os: ubuntu-24.04-arm
            arch: linux-aarch64
          - os: macos-latest
            arch: macos-aarch64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: What this build computes
        run: |
          cargo xtask hashes "values-${{ matrix.arch }}.tsv" \
            | tee "digest-${{ matrix.arch }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: run-${{ matrix.arch }}
          path: |
            digest-${{ matrix.arch }}.txt
            values-${{ matrix.arch }}.tsv

  compare:
    name: compare
    needs: digest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: run-*
          merge-multiple: true
      - name: The digests
        run: |
          for file in digest-*.txt; do
            {
              echo "### ${file}"
              echo '```'
              cat "$file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: x86-64 and aarch64 compute the same numbers
        run: |
          set -u
          {
            echo "### Linux x86-64 against Linux aarch64"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo xtask compare-hashes values-linux-x86_64.tsv values-linux-aarch64.tsv \
            | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: What another C library computes, reported
        if: always()
        run: |
          set -u
          {
            echo "### Linux aarch64 against macOS aarch64 (another C library)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo xtask compare-hashes values-linux-aarch64.tsv values-macos-aarch64.tsv \
            | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
