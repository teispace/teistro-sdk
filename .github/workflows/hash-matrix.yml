# The cross-architecture hash matrix: the same source computes the same
# numbers, or it says where it does not and by how much.
#
# `cargo xtask hashes` walks a fixed scenario through the calendars, the
# astronomy, the house systems and the classical model, hashes every
# value's bits per section, and writes every value out;
# `cargo xtask compare-hashes` says how many values differ and by how many
# units in the last place. This workflow runs both across the platforms
# ADR-0022 promises byte-identical output on: Linux on x86-64 and
# aarch64, macOS, Windows, and wasm32.
#
# **Every comparison fails the job.** Until 2026-09-25 only the two Linux
# architectures were held, because they share glibc, and macOS was
# reported and not failed: its maths library rounds the last place of
# sin, atan2 and the rest differently, 2 015 values apart in the
# `astro` and `houses` sections. The SDK now takes those functions from
# one pure-Rust `libm` on every target (`teistro_core::math`, held by the
# `uses-one-libm` lint), so a difference on any platform is a defect and
# not a property of its C library (`docs/03-design/wasm-binding.md`,
# "Determinism first").
#
# wasm32 is the scenario binary built for `wasm32-wasip1` and run under
# Node's own WASI (`crates/scenario/wasi.mjs`), printing the same values
# file `cargo xtask hashes` writes natively.
#
# The phones are the same binary built for a mobile slice's triple and
# run where that slice runs: Android x86-64 on an emulator at the
# slices' API floor, and the arm64 iOS simulator. Neither reads a file,
# so `values` on standard output is the whole run. A mobile row that
# computes differently is a defect in the core, not in the Flutter
# package (`docs/03-design/flutter-build-hook.md`, §5 step 3).
#
# It runs nightly and on demand rather than on every push: the fast check
# stays fast (ADR-0014), and a difference here is a property of the
# toolchain and the platform, not of a pull request.
name: hash-matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

defaults:
  run:
    # Windows's default is PowerShell; every step here is written once.
    shell: bash

jobs:
  digest:
    name: digest (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux-x86_64
          - os: ubuntu-24.04-arm
            arch: linux-aarch64
          - os: macos-latest
            arch: macos-aarch64
          - os: windows-latest
            arch: windows-x86_64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: What this build computes
        run: |
          cargo xtask hashes "values-${{ matrix.arch }}.tsv" \
            | tee "digest-${{ matrix.arch }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: run-${{ matrix.arch }}
          path: |
            digest-${{ matrix.arch }}.txt
            values-${{ matrix.arch }}.tsv

  wasm32:
    name: digest (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: What wasm32 computes
        run: |
          cargo build --release -p teistro-scenario --target wasm32-wasip1
          node crates/scenario/wasi.mjs \
            target/wasm32-wasip1/release/teistro-scenario.wasm values > values-wasm32.tsv
          wc -l values-wasm32.tsv | tee digest-wasm32.txt
      - uses: actions/upload-artifact@v4
        with:
          name: run-wasm32
          path: |
            digest-wasm32.txt
            values-wasm32.tsv

  android:
    name: digest (android-x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: The pinned Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$(cat xtask/ndk.version)" > /dev/null
      - name: The scenario, linked as the Android slices are
        run: |
          ndk="$ANDROID_HOME/ndk/$(cat xtask/ndk.version)"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
          cargo build --release -p teistro-scenario --target x86_64-linux-android
      # The runner's KVM, which the emulator needs to run at speed.
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: What Android computes, at the slices' API floor
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86_64
          script: |
            adb push target/x86_64-linux-android/release/teistro-scenario /data/local/tmp/teistro-scenario
            adb shell chmod 755 /data/local/tmp/teistro-scenario
            adb exec-out /data/local/tmp/teistro-scenario values > values-android-x86_64.tsv
            wc -l values-android-x86_64.tsv | tee digest-android-x86_64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: run-android-x86_64
          path: |
            digest-android-x86_64.txt
            values-android-x86_64.tsv

  ios:
    name: digest (ios-sim-aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: The scenario, built as the simulator slice is
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "14.0"
        run: cargo build --release -p teistro-scenario --target aarch64-apple-ios-sim
      - name: What the iOS simulator computes
        run: |
          set -eu
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          phones = [d["udid"] for r, ds in sorted(runtimes.items()) if "iOS" in r
                    for d in ds if d["name"].startswith("iPhone")]
          print(phones[-1])')
          xcrun simctl boot "$device"
          xcrun simctl spawn "$device" \
            "$PWD/target/aarch64-apple-ios-sim/release/teistro-scenario" values \
            > values-ios-sim-aarch64.tsv
          xcrun simctl shutdown "$device"
          wc -l values-ios-sim-aarch64.tsv | tee digest-ios-sim-aarch64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: run-ios-sim-aarch64
          path: |
            digest-ios-sim-aarch64.txt
            values-ios-sim-aarch64.tsv

  compare:
    name: compare
    needs: [digest, wasm32, android, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: run-*
          merge-multiple: true
      - name: The digests
        run: |
          for file in digest-*.txt; do
            {
              echo "### ${file}"
              echo '```'
              cat "$file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Every platform computes what Linux x86-64 computes
        # Every comparison runs even after one fails, and a platform whose
        # values never arrived fails too: `compare-hashes` refuses a
        # missing file, so a crashed runner reads as a failure and never as
        # an absence.
        run: |
          set -u
          status=0
          for other in linux-aarch64 macos-aarch64 windows-x86_64 wasm32 \
            android-x86_64 ios-sim-aarch64; do
            {
              echo "### Linux x86-64 against ${other}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cargo xtask compare-hashes values-linux-x86_64.tsv "values-${other}.tsv" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            [ "${PIPESTATUS[0]}" -eq 0 ] || status=1
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"
