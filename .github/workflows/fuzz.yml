# The fuzz targets' long run (`docs/05-testing/03-fuzzing.md`): each for
# an hour, weekly and on demand. The nightly minute is verify's `fuzz`
# job. A crash fails the run and its input is uploaded; the coverage the
# run found is offered back as an artefact, never committed by the job.
name: fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Held to fuzz/Cargo.toml's targets by `the_long_run_fuzzes_every_target`.
        target: [json, pack, key, mf2, mcp, published, blob, digest]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: The target for an hour from the committed corpus
        working-directory: fuzz
        # The digest's C reader is built with clang's sanitizers; gcc has no
        # `-fsanitize=fuzzer-no-link`.
        env:
          CC: clang
        # The installed cargo-fuzz is a musl build and would build for musl,
        # where a sanitizer cannot link, so the host's triple is named.
        run: |
          mkdir -p found
          host=$(rustc +nightly -vV | sed -n 's/^host: //p')
          cargo +nightly fuzz run --target "$host" ${{ matrix.target }} found corpus/${{ matrix.target }} -- \
            -max_total_time=3600 -rss_limit_mb=4096 -timeout=30
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-found-${{ matrix.target }}
          path: fuzz/found
