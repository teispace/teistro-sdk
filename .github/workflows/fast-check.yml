# The fast check: runs on every push to main and every pull request.
# It is the gate for documentation and for format, lint and unit tests of
# the Rust workspace. The full verify matrix runs nightly and on tags (see
# docs/06-cicd/). CI on a public repository costs nothing, but the fast
# check stays fast on purpose: a contributor should see red within minutes.
#
# Every task is `cargo xtask <task>` (ADR-0014): the tooling is Rust, so a
# job needs the Rust toolchain and nothing else. The gates that need a C
# compiler, a Node or a Dart run in `verify.yml`, nightly and before a
# release.
name: fast-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fast-check:
    name: fast-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Dependency policy (licence allow list, bans, advisories, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: Unit tests
        run: cargo test --workspace
      - name: Documentation gates
        run: cargo xtask check-docs
      - name: Golden-vector corpus (schema, manifest, settings hashes, forbidden terms)
        run: cargo xtask check-fixtures
      - name: Catalogue gate
        run: cargo xtask check-catalogue
      - name: Calendar tables gate (the official rows and the engine reproduce the checked-in table)
        run: cargo xtask check-calendars
      - name: Time tables gate (the IERS series and the leap-second list reproduce the checked-in tables)
        run: cargo xtask check-time
      - name: Accuracy document gate (the measurement tests reproduce the checked-in document)
        run: cargo xtask check-accuracy
      - name: Intl gate (the i18n/ sources validate and reproduce the checked-in typed messages)
        run: cargo xtask check-intl
      - name: FFI gate (the boundary crates reproduce the checked-in API description and C header)
        run: cargo xtask check-ffi
      - name: Determinism lints (unordered iteration, ambient input, the unsafe inventory, exact classification)
        run: cargo xtask check-lints
      - name: Version gate (one version across the workspace, both package manifests and the API description)
        run: cargo xtask check-versions

  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Every commit in the pull request carries a Signed-off-by line
        run: cargo xtask check-dco "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
