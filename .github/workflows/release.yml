# The release: one tag, every platform, every package.
#
# A tag `vX.Y.Z` is pushed at a commit whose workspace already declares
# X.Y.Z (`cargo xtask version` moves it, `check-versions` holds it, and
# `check-tag` here refuses a tag that does not match). Every job after
# that is `cargo xtask ...`, so what runs on a runner is what runs on a
# laptop.
#
#   gate     the tag is the version, and the version is releasable
#   verify   the full verify matrix, called here so publish can wait on it
#   build    each platform builds its own artefacts and manifest
#   wasm     the wasm package, one artefact for every host, built once
#   stage    the manifests are merged and the two published packages staged
#   publish  the GitHub release, then npm, pub.dev and PyPI
#
# A dispatch runs everything except `publish`, which is how the whole
# chain is rehearsed before a tag exists; only a tag publishes.
name: release

on:
  push:
    tags: ["v*"]
  # Builds, stages and checks everything; publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

# A gate that skips part of itself for a missing tool fails here rather
# than reporting green (`xtask/src/skip.rs`).
env:
  TEISTRO_STRICT: "1"

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The tag is the version the repository carries
        if: github.event_name == 'push'
        run: cargo xtask check-tag "${GITHUB_REF_NAME}"
      - name: One version across the workspace and both packages
        run: cargo xtask check-versions
      - name: The gates the fast check runs
        run: |
          cargo xtask check-docs
          cargo xtask check-ffi
          cargo xtask check-lints
      - id: version
        name: What is being released
        run: |
          version=$(cargo xtask version)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "releasing ${version}" >> "$GITHUB_STEP_SUMMARY"
      # Skipped only for a rehearsal at the unreleased version, which by
      # definition has no entry: without the exception a dispatch stopped
      # here and never reached `build`, `wasm` or `stage`, so the chain the
      # header promises to rehearse could not be. A tag always checks it.
      - name: The changelog answers whether any number moved
        if: github.event_name == 'push' || steps.version.outputs.version != '0.0.0'
        run: cargo xtask changelog-entry "$(cargo xtask version)"

  # Every binding on every platform, as the nightly runs it. Publishing
  # waits for it: verify used to run on the tag as a workflow of its own,
  # so a release could publish while verify was still red.
  verify:
    name: verify
    needs: gate
    uses: ./.github/workflows/verify.yml

  build:
    name: build (${{ matrix.platform }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: darwin-arm64
          # Intel macOS; see `xtask/src/platform.rs` for why not
          # `macos-13`. This job cannot be cross-compiled from the arm64
          # runner instead: it runs `check-package`, which runs what it
          # built.
          - os: macos-15-intel
            platform: darwin-x64
          - os: windows-latest
            platform: win32-x64
          - os: windows-11-arm
            platform: win32-arm64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # `check-package` runs the Java consumer against the jar; Temurin has
      # no JDK 25 for Windows on Arm, Microsoft's build does.
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.platform == 'win32-arm64' && 'microsoft' || 'temurin' }}
          java-version: "25"
      # A Linux row links against its glibc floor, not the runner's, and
      # `package` refuses a file that asks for more (`xtask/src/floor.rs`).
      - name: The linker that holds a Linux build to its glibc floor
        if: runner.os == 'Linux'
        run: pip install -r xtask/zigbuild-requirements.txt
      # Every shipped library is built through cargo-auditable, which links
      # the crates it carries into it (`xtask/src/sbom.rs`); the version is
      # pinned in the one file a failing local build names.
      - id: auditable
        name: The pinned cargo-auditable
        shell: bash
        run: echo "version=$(cat xtask/cargo-auditable.version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable@${{ steps.auditable.outputs.version }}
      - name: What this platform ships
        run: cargo xtask package ${{ matrix.platform }}
      - name: The packages installed into throwaway projects and run
        run: cargo xtask check-package
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          # This platform's own npm package and manifest, not the merged
          # one `check-package` wrote from one platform: the merge and the
          # package that depends on them are staged once, in the next job.
          path: |
            target/dist/*.gz
            target/dist/teistro-*.json
            target/dist/npm/@teistro/sdk-*
            target/dist/npm/@teistro/mcp-*
          if-no-files-found: error
          retention-days: 7

  # The musl rows: built and installed in Alpine on the Linux runner of
  # each architecture, the container being the platform (`xtask/alpine.sh`).
  # No Swatinem cache, which reads the runner's toolchain and not the
  # container's.
  musl:
    name: build (${{ matrix.platform }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64-musl
            container: alpine:3.21
          - os: ubuntu-24.04-arm
            platform: linux-arm64-musl
            container: alpine:3.21
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: What this platform ships, installed into throwaway projects and run
        run: >-
          docker run --rm -v "$PWD:/w" -w /w -e TEISTRO_STRICT ${{ matrix.container }}
          sh xtask/alpine.sh "package ${{ matrix.platform }}" check-package
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            target/dist/*.gz
            target/dist/teistro-*.json
            target/dist/npm/@teistro/sdk-*
            target/dist/npm/@teistro/mcp-*
          if-no-files-found: error
          retention-days: 7

  # The wasm package is the same layer over a wasm module, one artefact
  # for every host, so it is built here once rather than by each platform.
  # `check-wasm` is the gate that proves it: the Node suite through its own
  # loader, headless Chrome held to Node bit for bit, and the package
  # installed and run as a consumer would. The staged package goes to the
  # `stage` job beside the platform packages, and `package stage` refuses
  # a release without it.
  wasm:
    name: wasm
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The wasm package, staged
        run: cargo xtask package wasm
      - name: The package through the Node suite, a browser and an install
        run: cargo xtask check-wasm
      - uses: actions/upload-artifact@v4
        with:
          # Not `dist-*`: the platforms' artefacts are merged into
          # `target/dist` by that pattern, and this one holds a package's
          # files at its root.
          name: wasm-package
          path: target/dist/npm/@teistro/sdk-wasm
          if-no-files-found: error
          retention-days: 7

  stage:
    name: stage
    needs: [gate, build, musl, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: target/dist
      # An artefact holds the files under the path it was uploaded from,
      # so the wasm package is fetched on its own, into its own directory.
      - uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: target/dist/npm/@teistro/sdk-wasm
      # The Java package is compiled, documented and jarred here
      # (`xtask/src/java_package.rs`).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Every platform, merged and staged
        run: cargo xtask package stage
      - name: What is being published
        run: |
          {
            echo "### ${{ needs.gate.outputs.version }}"
            echo '```'
            cat target/dist/checksums.txt
            echo '```'
            echo '#### The Maven artefacts, in bytes'
            echo '```'
            wc -c target/dist/maven/com/teispace/teistro/*/*.jar target/dist/maven/com/teispace/teistro/*/*.pom
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: target/dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [gate, verify, stage]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      # npm's and PyPI's trusted publishing, npm provenance, pub.dev's
      # automated publishing and the build attestations all take the
      # runner's OIDC token instead of a long-lived credential.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: dtolnay/rust-toolchain@stable
      # Which workflow, at which commit, built each file, signed and
      # recorded in a public log: `gh attestation verify <file> --repo
      # teispace/teistro-sdk` checks one. The bills are attested too, so
      # what a file says it carries is held to the run that built it.
      - name: Every file's build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.gz
            dist/*.cdx.json
            dist/checksums.txt
            dist/manifest.json
            dist/maven/com/teispace/teistro/*/*.jar
            dist/maven/com/teispace/teistro/*/*.pom
      - name: The GitHub release, with the archives and their digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cargo xtask changelog-entry "${{ needs.gate.outputs.version }}" > notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "Teistro ${{ needs.gate.outputs.version }}" \
            --notes-file notes.md \
            dist/*.gz dist/*.cdx.json dist/checksums.txt dist/manifest.json \
            dist/maven/com/teispace/teistro/*/*.jar dist/maven/com/teispace/teistro/*/*.pom

      # npm 11.5.1 is the first to publish by the runner's OIDC token, which
      # it tries before any token. A package's first publish still takes
      # `NPM_TOKEN`, because trusted publishing is configured on a package
      # that exists (`06-cicd/03-release-process.md`).
      - name: An npm that publishes by who the workflow is
        run: npm install --global npm@11
      - name: The platform packages and the wasm one, then the ones that depend on the platforms
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          # `sdk-*` is every platform package and `sdk-wasm`, which
          # depends on none of them; `package stage` refused to stage a
          # release missing any of the six.
          for package in dist/npm/@teistro/sdk-*; do
            npm publish --provenance --access public "${package}"
          done
          npm publish --provenance --access public dist/npm/@teistro/sdk
          # The agent server the same way: a package a platform carrying
          # the program, then the launcher that depends on them.
          for package in dist/npm/@teistro/mcp-*; do
            npm publish --provenance --access public "${package}"
          done
          npm publish --provenance --access public dist/npm/@teistro/mcp

      - name: The Dart package
        run: dart pub publish --force
        working-directory: dist/pub/teistro

      - name: The Python package, built
        run: |
          set -eu
          python -m pip install --disable-pip-version-check build
          python -m build --sdist --wheel --outdir ../../pypi-dist .
          # A wheel a platform, each carrying its library, which
          # `package stage` wrote (`xtask/src/wheel.rs`); the pure wheel
          # and the sdist stay for a host none is tagged for.
          cp ../wheels/*.whl ../../pypi-dist/
        working-directory: dist/pypi/teistro
      # Trusted publishing: PyPI takes the runner's OIDC token, as npm and
      # pub.dev do, so no long-lived credential is stored here, and each
      # file gets a PEP 740 attestation. `twine upload` alone exchanges no
      # token and would have failed for want of a credential.
      - name: The Python package, published
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi-dist

      # Central has no trusted publishing, so a Portal user token minted
      # for the release and revoked after; every file is signed with the
      # key whose fingerprint `SECURITY.md` names. The first release is
      # `USER_MANAGED` (validated, then published by hand in the Portal);
      # later ones pass `--automatic` (`xtask/src/maven_publish.rs`).
      - name: The PGP key that signs the Maven bundle
        run: printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      - name: The Java package, to Maven Central
        run: cargo xtask publish maven --dist dist
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_GPG_FINGERPRINT: ${{ vars.MAVEN_GPG_FINGERPRINT }}
