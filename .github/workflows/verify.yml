# The full verify matrix: every gate that needs a toolchain the fast check
# does not have, on every platform the SDK ships for.
#
# The fast check stays Rust-only and runs on every push (ADR-0014). This
# runs nightly, on demand, and before a release, because a C compiler, a
# Node and a Dart on every platform is minutes of machine time and a
# contributor should not wait for it to see a typo.
#
# A skip is not a pass. Each gate prints `skip` with the tool it wanted,
# and `TEISTRO_STRICT` makes any skip fail the gate. The only exceptions
# are the ones the gate itself excuses by design, each saying why
# (`xtask/src/skip.rs`).
#
# A release runs this workflow itself (`workflow_call`), and its publish
# job waits for it, so nothing is published past a red matrix.
name: verify

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    # Nightly, an hour after the hash matrix, so the two do not queue
    # against each other for runners.
    - cron: "0 4 * * *"

permissions:
  contents: read

env:
  TEISTRO_STRICT: "1"

jobs:
  bindings:
    name: bindings (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    # Each binding's layer under its own coverage tool, on one row: the
    # figure is the layer's, not the platform's
    # (`03-design/binding-coverage.md`). Empty elsewhere, which is unset.
    env:
      TEISTRO_BINDING_COVERAGE: ${{ matrix.platform == 'linux-x64' && 'target/binding-coverage' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The one row that builds the wasm package too, so
          # `check-parity` compares its runner with the other five. The
          # module is one artefact for every host, so one row is enough.
          - os: ubuntu-latest
            platform: linux-x64
            targets: wasm32-unknown-unknown
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: darwin-arm64
          # Intel macOS. **Not `macos-13`**: that image was retired, and
          # nothing picks the label up -- eleven dispatches on
          # 2026-09-12 sat in `queued` from the moment they were made,
          # so this row alone kept every run of this workflow from ever
          # reaching a conclusion. A job nobody runs is worse than a job
          # that fails.
          - os: macos-15-intel
            platform: darwin-x64
          - os: windows-latest
            platform: win32-x64
          - os: windows-11-arm
            platform: win32-arm64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # FFM was final in Java 22; the binding is compiled for 22 and tested
      # on 25, the LTS its audience runs (`03-design/java-binding.md` §3).
      # Temurin publishes no JDK 25 for Windows on Arm; Microsoft's build
      # of OpenJDK does, so that row takes it and every other row Temurin.
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.platform == 'win32-arm64' && 'microsoft' || 'temurin' }}
          java-version: "25"
      # A Linux row links against its glibc floor, not the runner's
      # (`xtask/src/floor.rs`); `check-package` packages the host with it.
      - name: The linker that holds a Linux build to its glibc floor
        if: runner.os == 'Linux'
        run: pip install -r xtask/zigbuild-requirements.txt
      # Every shipped library is built through cargo-auditable, which links
      # the crates it carries into it (`xtask/src/sbom.rs`); the version is
      # pinned in the one file a failing local build names.
      - id: auditable
        name: The pinned cargo-auditable
        shell: bash
        run: echo "version=$(cat xtask/cargo-auditable.version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable@${{ steps.auditable.outputs.version }}
      - name: One version across the workspace and both packages
        run: cargo xtask check-versions
      - name: The C binding against the generated header
        run: cargo xtask check-c
      - name: The Node binding, its decoders and a strict consumer
        run: cargo xtask check-node
      - name: The Dart binding against the real library
        run: cargo xtask check-dart
      - name: The Python binding, its sizes and a strict type check
        run: cargo xtask check-python
      - name: The Java binding at its floor's release, against the real library
        run: cargo xtask check-java
      # The floor itself: the binding is compiled for 22, so one row runs it
      # on a JDK 22 too (`03-design/java-binding.md` §11); FFM's API has not
      # changed since 22, and this is what would show it if it did.
      - if: matrix.platform == 'linux-x64'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.platform == 'linux-x64'
        with:
          name: binding-coverage
          path: target/binding-coverage
          if-no-files-found: ignore
      - name: The Java binding on the JDK 22 floor
        if: matrix.platform == 'linux-x64'
        env:
          TEISTRO_BINDING_COVERAGE: ""
        run: cargo xtask check-java
      - name: The Rust facade's examples and its own tests
        run: cargo xtask check-rust
      - name: The bindings against each other, value by value (and the wasm package, where built)
        run: cargo xtask check-parity
      - name: The packages installed into throwaway projects and run
        run: cargo xtask check-package
      # What the row built and measured, for `SIZES.md` (the `sizes` job),
      # kept when a later step fails, as the wasm row's is: a test failing
      # on one platform must not leave the record unable to move.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sizes-${{ matrix.platform }}
          path: target/sizes/
          if-no-files-found: error
      - name: Each binding's layer at or over its coverage floors
        if: matrix.platform == 'linux-x64'
        run: cargo xtask check-coverage --bindings target/binding-coverage
      - name: The documentation site builds and renders every generated page
        # One machine is enough: the site is the same everywhere, and the
        # matrix is here for the libraries.
        if: matrix.platform == 'linux-x64'
        run: cargo xtask check-site

  # The musl rows, in Alpine on the Linux runner of each architecture
  # (`xtask/alpine.sh`): every binding a musl host can run, and the
  # packages installed. Dart has no musl build, and the parity check
  # compares every runner, Dart's among them, so neither runs here.
  musl:
    name: bindings (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64-musl
            container: alpine:3.21
          - os: ubuntu-24.04-arm
            platform: linux-arm64-musl
            container: alpine:3.21
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: The C, Node, Python and Java bindings, and the packages installed
        run: >-
          docker run --rm -v "$PWD:/w" -w /w -e TEISTRO_STRICT -e GITHUB_SHA -e GITHUB_RUN_ID
          ${{ matrix.container }}
          sh xtask/alpine.sh check-c check-node check-python check-java check-package
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sizes-${{ matrix.platform }}
          path: target/sizes/
          if-no-files-found: error

  # The staged wasm package against the Node binding's own suite,
  # unchanged, and in headless Chrome, whose answer must equal Node's to
  # the bit (03-design/wasm-binding.md §5). One platform is enough: the
  # module is one artefact for every host, and the hash matrix already
  # holds wasm32's arithmetic to Linux's bit for bit. The runner image
  # carries Chrome; the gate installs the `wasm-bindgen` CLI the lockfile
  # pins under `target/tools`, which the cache keeps.
  wasm:
    name: wasm (nodejs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The wasm package passes the Node suite unchanged, and in a browser as in Node
        run: cargo xtask check-wasm
      # Uploaded when the budget fails too: a module over its budget is
      # what `cargo xtask sizes --from DIR --why SENTENCE` moves it with,
      # and a run that kept it back would leave nothing to record.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sizes-wasm
          path: target/sizes/
          if-no-files-found: error

  # A Flutter app on the release's own Android slices: the three built as
  # the release builds them, the packages staged with their digests, and
  # `flutter build apk --release` run with the hook reading the archives.
  # The APK is read back (`xtask/src/flutter_package.rs`): each ABI's
  # library stored, 16 KB-aligned on the 64-bit rows, and still the slice
  # for its ABI after Gradle stripped it.
  flutter:
    name: flutter (android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: The pinned Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$(cat xtask/ndk.version)" > /dev/null
      - id: auditable
        name: The pinned cargo-auditable
        shell: bash
        run: echo "version=$(cat xtask/cargo-auditable.version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable@${{ steps.auditable.outputs.version }}
      - name: The three Android slices, as the release builds them
        run: |
          for row in android-arm64 android-arm android-x64; do
            cargo xtask package "$row"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: An app built on them, and its APK read back
        run: cargo xtask check-flutter android
      # The app's integration test (the four facts the published Dart
      # package's consumer asserts) on an emulator at the slices' API floor.
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The four facts inside the app, on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86_64
          script: cargo xtask check-flutter android-emulator

  # The same app for an iOS device, unsigned, on the release's own
  # ios-arm64 slice: Xcode leaves the library as a framework whose binary
  # is a universal file, which must hold that slice alone, at its floor.
  # Then the integration test on an iPhone simulator the run boots.
  flutter-ios:
    name: flutter (ios)
    runs-on: macos-latest
    # About twenty minutes when it passes; a simulator that hangs once ran
    # five hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - id: auditable
        name: The pinned cargo-auditable
        shell: bash
        run: echo "version=$(cat xtask/cargo-auditable.version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable@${{ steps.auditable.outputs.version }}
      - name: The device and simulator slices, as the release builds them
        run: |
          cargo xtask package ios-arm64
          cargo xtask package ios-sim-arm64
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: An app built on it, and its framework read back
        run: cargo xtask check-flutter ios
      - name: The four facts inside the app, on a simulator
        run: cargo xtask check-flutter ios-simulator

  # Every artefact the run built, held to `docs/05-testing/sizes.json`
  # within 2% and complete: every platform, profile and bundle
  # (03-design/generated-pages.md §1). When it fails, the record the run
  # would write is uploaded as `sizes-record`, to be committed with
  # `cargo xtask sizes --from DIR` from the same fragments.
  sizes:
    needs: [bindings, musl, wasm]
    # Run after a failed budget as well, so the record that would move it
    # is written; an artefact a failed job never measured is refused as
    # missing, so this cannot pass on part of a run.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: sizes-*
          path: target/sizes-run
      - name: Every artefact the run built, against the record
        run: cargo xtask check-sizes --from target/sizes-run
      - name: The record this run would write
        if: failure()
        run: cargo xtask sizes --from target/sizes-run
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sizes-record
          path: |
            docs/05-testing/sizes.json
            docs/05-testing/SIZES.md

  # The tiers a default build does not compile are scored here and
  # recorded in docs/05-testing/conformance.json; a corpus report is
  # deterministic, so a run must match the record exactly.
  conformance:
    needs: [tiers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: conformance-*
          path: target/conformance-run
      - name: Every recorded tier's corpus score, against the record
        run: cargo xtask check-conformance --from target/conformance-run
      - name: The record this run would write
        if: failure()
        run: cargo xtask conformance --from target/conformance-run
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-record
          path: docs/05-testing/conformance.json

  # A slow body's crossing search strides by the shortest run between its
  # stations, a table; this holds the table to every body's stations over
  # the built-in ephemeris's whole coverage, sampled daily, and every
  # crossing to the fine scan's (03-design/station-runs-measured.md).
  # Here and not in fast-check: it is minutes of ephemeris on four cores,
  # and a branch that touches the search or the ephemeris dispatches this
  # workflow before it merges.
  stations:
    name: station runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Every body's shortest run bounds its scan, and the scan is the fine one's to the bit
        run: cargo xtask check-stations

  # Rules holding on exactly the same charts are probable duplicates; this
  # evaluates every shipped rule over 6 000 charts the SDK computes and
  # fails on a group of one text nothing explains
  # (03-design/rule-cofiring-measured.md). Here and not in fast-check: each
  # chart's reading computes its own panchanga, which is minutes, and a
  # branch that adds rules dispatches this workflow before it merges.
  cofiring:
    name: rules that hold together
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Every group of rules holding on the same charts is explained
        run: cargo xtask check-cofiring

  # The fuzz targets' smoke run (`05-testing/03-fuzzing.md`): each for a
  # minute from the committed corpus. A crash fails the job and its input
  # is uploaded; the long run is `fuzz.yml`, weekly.
  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: The harness names every JSON section of a chart request, every slot answers its seed, and the corpora are the seed tables
        run: cargo +nightly test --manifest-path fuzz/Cargo.toml --lib
      - name: Each target for a minute from the committed corpus
        working-directory: fuzz
        # The installed cargo-fuzz is a musl build and would build for musl,
        # where a sanitizer cannot link, so the host's triple is named.
        run: |
          host=$(rustc +nightly -vV | sed -n 's/^host: //p')
          for target in $(cargo +nightly fuzz list); do
            mkdir -p "found/$target"
            cargo +nightly fuzz run --target "$host" "$target" "found/$target" "corpus/$target" -- \
              -max_total_time=60 -rss_limit_mb=4096 -timeout=30
          done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts

  # The crates whose own code may be `unsafe` (the workspace forbids it
  # everywhere else) run their unit tests under Miri: the C ABI's strings,
  # blobs, panics and handshakes, and the vtable an engine is called
  # through. A test whose work is safe code and takes Miri many minutes
  # opts out by name with `cfg_attr(miri, ignore = "why")`, so a new test
  # is in by default. sha2 0.11.0's aarch64 backend loads sixteen bytes
  # through a reference to one `u32`, which Miri reports on an aarch64
  # machine (RustCrypto/hashes#920, fixed by #922, unreleased), so the
  # soft backend is named and a run here and on Apple silicon takes one
  # path until a release carries the fix. Isolation is off for the tests
  # that read a file.
  miri:
    name: no undefined behaviour (Miri)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri
      - name: The vtable and the C ABI's unit tests under Miri
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
          RUSTFLAGS: --cfg sha2_backend="soft"
        run: cargo +nightly miri test -p teistro-port-ephemeris -p teistro-ffi --lib

  # Every library crate's tests under llvm's source coverage, each crate's
  # share of lines held to the floor `docs/05-testing/coverage.json` keeps
  # for it (`cargo xtask coverage --from FILE` raises them). The summary is
  # uploaded so a run that clears its floors can be recorded.
  coverage:
    name: coverage floors
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      # Branch coverage is llvm's `-Z coverage-options=branch`, which only a
      # nightly compiler takes. The nightly is pinned, since a floor is a
      # count of the compiler's branches and a moving compiler would move
      # them; it is raised by hand with the floors re-recorded.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-21
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage-nightly-2026-10-21
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Every library crate's tests, measured, lines and branches
        run: >-
          cargo +nightly-2026-10-21 llvm-cov --branch --workspace --json --summary-only
          --output-path coverage.json
          --exclude xtask --exclude teistro-test-allocator --exclude teistro-test-adapter
          --exclude teistro-node --exclude teistro-wasm
          --exclude teistro-spike-slice --exclude teistro-spike-a-ffi --exclude teistro-spike-a-gen
          --exclude teistro-spike-a-node --exclude teistro-spike-b-bridge --exclude teistro-spike-intl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.json
          if-no-files-found: ignore
      - name: Each crate at or over its floors
        run: cargo +nightly-2026-10-21 xtask check-coverage --from coverage.json
      # The same pinned nightly counts the items that can carry an example.
      - name: Every item of the held crates carries an example
        run: cargo +nightly-2026-10-21 xtask check-doc-examples

  # The same crates' unit and integration tests built with
  # AddressSanitizer, which on Linux brings LeakSanitizer: every ABI test
  # (`crates/ffi/tests`), the engine adapter loaded through the vtable,
  # and the vtable's own tests, at native speed. The target is named so
  # build scripts and proc macros are left uninstrumented. Then the state
  # threads share under ThreadSanitizer, the standard library rebuilt
  # instrumented: the ephemeris memo four threads ask at once; the
  # surface tests, whose workers each build a context over the SDK's
  # lazily built tables; the C ABI's contexts founded at once and one
  # moved between threads; and the agent server's tasks, watches and HTTP
  # connections, each on threads of its own. Last, the Node and Python suites against the addon
  # and the C library built with ASan, clang's runtime loaded ahead of an
  # unchanged interpreter, so each binding's own crossing is checked too.
  sanitizers:
    name: no memory errors, leaks or data races (ASan, TSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: sanitizers
      # On Linux the ASan runtime is linked into the test binary, and the
      # adapter the loader tests open is instrumented too, so the binary
      # exports its symbols for that library to bind to.
      - name: The C ABI's and the vtable's tests under ASan and LSan
        env:
          RUSTFLAGS: -Zsanitizer=address -Clink-arg=-Wl,--export-dynamic
          ASAN_OPTIONS: detect_leaks=1
        run: cargo +nightly test -p teistro-ffi -p teistro-port-ephemeris --features teistro-port-ephemeris/load --lib --tests --target x86_64-unknown-linux-gnu
      - name: The state threads share under TSan
        env:
          RUSTFLAGS: -Zsanitizer=thread
        run: |
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu -p teistro-port-ephemeris --lib
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu -p teistro --test surface
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu -p teistro-ffi --features full --test threads
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu -p teistro-mcp --test tasks --test watch --test http
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The Node and Python suites with the SDK under ASan
        env:
          TEISTRO_STRICT: "1"
        run: cargo xtask check-asan

  # The C ABI's leak test again, under valgrind's memcheck: the counting
  # allocator proves every byte comes back, and memcheck adds what it
  # cannot see, a read of memory never written or already freed, and a
  # free of what was never allocated. Built by the stable compiler and
  # run uninstrumented, so it checks the code the bindings load. Leaks
  # count as errors only when definite or indirect: a lazily built table
  # is still reachable at exit by design.
  valgrind:
    name: no invalid access or leak under valgrind (C ABI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: valgrind
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: The C ABI's leak test under memcheck
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: >-
            valgrind --error-exitcode=1 --leak-check=full
            --errors-for-leak-kinds=definite,indirect
            --show-leak-kinds=definite,indirect
        run: cargo test -p teistro-ffi --test leaks

  # Phase 3's exit asks for the conformance kit against **every tier**,
  # and a tier is a cargo feature, so the kit is whichever one is
  # compiled: running it three times is running it three times. Without
  # this job that was a run by hand, which is a claim rather than a gate.
  #
  # One platform is enough. The tiers differ in which coefficients are
  # compiled in, not in how they are evaluated, and the library the
  # matrix above builds is the same code at `standard`.
  tiers:
    name: ephemeris tier (${{ matrix.tier }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tier: [compact, standard, full]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The provider kit and the crate's own tests at this tier
        env:
          TEISTRO_CONFORMANCE_DIR: ${{ github.workspace }}/target/conformance-tier
        run: >
          mkdir -p target/conformance-tier &&
          cargo test -p teistro-ephemeris-builtin
          --no-default-features --features ${{ matrix.tier }}
      # The tier's corpus score, which the `conformance` job holds to the
      # record (03-design/generated-pages.md §2.3).
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.tier }}
          path: target/conformance-tier/scores.jsonl
          if-no-files-found: error
      - name: The boundary carries this tier too
        run: >
          cargo test -p teistro-ffi
          --no-default-features --features builtin-${{ matrix.tier }},full
      - name: And the library builds with no built-in at all, which
          ADR-0008 requires stay possible
        if: matrix.tier == 'standard'
        run: cargo build -p teistro-ffi --no-default-features

  # The Teimeris adapter, the one real plugin (roadmap Track A step 8):
  # its tests, the provider kit over it under the published bounds, and
  # every binding loading it (`cargo xtask check-teimeris-adapter`).
  # Teimeris is a private repository, so the job clones it beside the SDK
  # with a read-only token in the `TEIMERIS_READ_TOKEN` secret. Without
  # the secret nothing is checked, and the job says so in a notice rather
  # than failing every night on a token only the maintainer can create.
  teimeris:
    name: teimeris adapter
    runs-on: ubuntu-latest
    env:
      TEIMERIS_READ_TOKEN: ${{ secrets.TEIMERIS_READ_TOKEN }}
    steps:
      - id: token
        name: Whether the read token is there
        run: |
          if [ -z "$TEIMERIS_READ_TOKEN" ]; then
            echo "::notice title=teimeris adapter not checked::no TEIMERIS_READ_TOKEN secret, so the adapter, the kit over it and the bindings' plugin tests did not run"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Teimeris beside the SDK, where the adapter's manifest reaches it
        if: steps.token.outputs.present == 'true'
        run: >
          git clone --depth 1
          "https://x-access-token:${TEIMERIS_READ_TOKEN}@github.com/teispace/teimeris.git"
          ../teimeris
      - if: steps.token.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.token.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            adapters/ephemeris-teimeris/rust
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: steps.token.outputs.present == 'true'
        uses: dart-lang/setup-dart@v1
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: The adapter, the kit over it, and every binding loading it
        if: steps.token.outputs.present == 'true'
        run: cargo xtask check-teimeris-adapter
      - if: ${{ !cancelled() && steps.token.outputs.present == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: teimeris-kit
          path: target/teimeris-kit/
          if-no-files-found: error

  # Every feature of every crate on its own, and each crate with none
  # (`05-testing/01-quality-bar.md`, "feature matrix"): a feature that
  # needs another it does not turn on builds in the workspace, where some
  # other crate turns it on, and fails for the consumer who asks for it
  # alone. Dev-dependencies are left out, since they are what turns them
  # on in a test build.
  features:
    name: feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6.45
      # `builtin-ephemeris` on the façade and the boundary is the base a
      # tier turns on, and the built-in crate with no tier is refused by
      # name (its `compile_error!`), so neither is built alone: the tiers
      # are, each on its own.
      - name: Each feature alone, and none, in every crate
        run: >
          cargo hack check --workspace --exclude teistro-ephemeris-builtin
          --each-feature --no-dev-deps --exclude-features builtin-ephemeris
      - name: Each tier of the built-in ephemeris alone
        run: >
          cargo hack check -p teistro-ephemeris-builtin --each-feature
          --exclude-no-default-features --exclude-features ingest --no-dev-deps
      # The tests too, under each feature alone and with none. The
      # façade, the boundary and the wasm module are tested per family by
      # the fast check, and the built-in's tiers by `ephemeris tier`. A
      # crate with no feature of its own runs its tests once more here
      # rather than be named in a list that would miss it gaining one.
      # A test build has its dev-dependencies, which may turn a feature
      # back on: that the crate does not need it is the step above's.
      - name: Every crate's tests under each feature alone, and none
        run: >
          cargo hack test --workspace --each-feature
          --exclude teistro --exclude teistro-ffi --exclude teistro-wasm
          --exclude teistro-ephemeris-builtin
