# The full verify matrix: every gate that needs a toolchain the fast check
# does not have, on every platform the SDK ships for.
#
# The fast check stays Rust-only and runs on every push (ADR-0014). This
# runs nightly, on demand, and before a release, because a C compiler, a
# Node and a Dart on every platform is minutes of machine time and a
# contributor should not wait for it to see a typo.
#
# A skip is not a pass. Each gate prints `skip` with the tool it wanted,
# and `TEISTRO_STRICT` makes any skip fail the gate. The only exceptions
# are the ones the gate itself excuses by design, each saying why
# (`xtask/src/skip.rs`).
#
# A release runs this workflow itself (`workflow_call`), and its publish
# job waits for it, so nothing is published past a red matrix.
name: verify

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    # Nightly, an hour after the hash matrix, so the two do not queue
    # against each other for runners.
    - cron: "0 4 * * *"

permissions:
  contents: read

env:
  TEISTRO_STRICT: "1"

jobs:
  bindings:
    name: bindings (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The one row that builds the wasm package too, so
          # `check-parity` compares its runner with the other five. The
          # module is one artefact for every host, so one row is enough.
          - os: ubuntu-latest
            platform: linux-x64
            targets: wasm32-unknown-unknown
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: darwin-arm64
          # Intel macOS. **Not `macos-13`**: that image was retired, and
          # nothing picks the label up -- eleven dispatches on
          # 2026-09-12 sat in `queued` from the moment they were made,
          # so this row alone kept every run of this workflow from ever
          # reaching a conclusion. A job nobody runs is worse than a job
          # that fails.
          - os: macos-15-intel
            platform: darwin-x64
          - os: windows-latest
            platform: win32-x64
          - os: windows-11-arm
            platform: win32-arm64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # A Linux row links against its glibc floor, not the runner's
      # (`xtask/src/floor.rs`); `check-package` packages the host with it.
      - name: The linker that holds a Linux build to its glibc floor
        if: runner.os == 'Linux'
        run: pip install -r xtask/zigbuild-requirements.txt
      # Every shipped library is built through cargo-auditable, which links
      # the crates it carries into it (`xtask/src/sbom.rs`); the version is
      # pinned in the one file a failing local build names.
      - id: auditable
        name: The pinned cargo-auditable
        shell: bash
        run: echo "version=$(cat xtask/cargo-auditable.version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable@${{ steps.auditable.outputs.version }}
      - name: One version across the workspace and both packages
        run: cargo xtask check-versions
      - name: The C binding against the generated header
        run: cargo xtask check-c
      - name: The Node binding, its decoders and a strict consumer
        run: cargo xtask check-node
      - name: The Dart binding against the real library
        run: cargo xtask check-dart
      - name: The Python binding, its sizes and a strict type check
        run: cargo xtask check-python
      - name: The Rust facade's examples and its own tests
        run: cargo xtask check-rust
      - name: The bindings against each other, value by value (and the wasm package, where built)
        run: cargo xtask check-parity
      - name: The packages installed into throwaway projects and run
        run: cargo xtask check-package
      - name: The documentation site builds and renders every generated page
        # One machine is enough: the site is the same everywhere, and the
        # matrix is here for the libraries.
        if: matrix.platform == 'linux-x64'
        run: cargo xtask check-site

  # The musl rows, in Alpine on the Linux runner of each architecture
  # (`xtask/alpine.sh`): every binding a musl host can run, and the
  # packages installed. Dart has no musl build, and the parity check
  # compares every runner, Dart's among them, so neither runs here.
  musl:
    name: bindings (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64-musl
            container: alpine:3.21
          - os: ubuntu-24.04-arm
            platform: linux-arm64-musl
            container: alpine:3.21
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: The C, Node and Python bindings, and the packages installed
        run: >-
          docker run --rm -v "$PWD:/w" -w /w -e TEISTRO_STRICT ${{ matrix.container }}
          sh xtask/alpine.sh check-c check-node check-python check-package

  # The staged wasm package against the Node binding's own suite,
  # unchanged, and in headless Chrome, whose answer must equal Node's to
  # the bit (03-design/wasm-binding.md §5). One platform is enough: the
  # module is one artefact for every host, and the hash matrix already
  # holds wasm32's arithmetic to Linux's bit for bit. The runner image
  # carries Chrome; the gate installs the `wasm-bindgen` CLI the lockfile
  # pins under `target/tools`, which the cache keeps.
  wasm:
    name: wasm (nodejs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The wasm package passes the Node suite unchanged, and in a browser as in Node
        run: cargo xtask check-wasm

  # A slow body's crossing search strides by the shortest run between its
  # stations, a table; this holds the table to every body's stations over
  # the built-in ephemeris's whole coverage, sampled daily, and every
  # crossing to the fine scan's (03-design/station-runs-measured.md).
  # Here and not in fast-check: it is minutes of ephemeris on four cores,
  # and a branch that touches the search or the ephemeris dispatches this
  # workflow before it merges.
  stations:
    name: station runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Every body's shortest run bounds its scan, and the scan is the fine one's to the bit
        run: cargo xtask check-stations

  # Phase 3's exit asks for the conformance kit against **every tier**,
  # and a tier is a cargo feature, so the kit is whichever one is
  # compiled: running it three times is running it three times. Without
  # this job that was a run by hand, which is a claim rather than a gate.
  #
  # One platform is enough. The tiers differ in which coefficients are
  # compiled in, not in how they are evaluated, and the library the
  # matrix above builds is the same code at `standard`.
  tiers:
    name: ephemeris tier (${{ matrix.tier }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tier: [compact, standard, full]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The provider kit and the crate's own tests at this tier
        run: >
          cargo test -p teistro-ephemeris-builtin
          --no-default-features --features ${{ matrix.tier }}
      - name: The boundary carries this tier too
        run: >
          cargo test -p teistro-ffi
          --no-default-features --features builtin-${{ matrix.tier }},full
      - name: And the library builds with no built-in at all, which
          ADR-0008 requires stay possible
        if: matrix.tier == 'standard'
        run: cargo build -p teistro-ffi --no-default-features
