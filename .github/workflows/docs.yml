# The documentation site: built on every push to `main`, on a pull
# request that touches it or what it is generated from, and published on
# a tag.
#
# The reference pages are generated by `cargo xtask gen ffi` and held
# equal to the boundary by `check-ffi`, which runs in the fast check. What
# this workflow adds is that they compile as MDX and the site renders
# them, which needs a Node; and, on a tag, that the site people read is
# the site of the release they are reading about.
name: docs

on:
  # Unfiltered on `main` and on tags: a path filter on a tag push
  # compares against the tagged commit alone, and a release whose last
  # commit touched no page would publish nothing.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "site/**"
      - "idl/api.json"
      - "crates/idl/src/emit/mdx.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: The reference is the one the boundary describes
        run: cargo xtask check-ffi
      - name: The site builds and renders every generated page
        run: cargo xtask check-site
      - name: The application's own types
        run: npm run types:check
        working-directory: site
      # Only when there is something a publish could take: a pull
      # request has proved the build and needs no artefact.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  publish:
    name: publish
    needs: build
    # Only a release publishes: the site people read is the site of the
    # version they are reading about.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
