[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Repository tasks for Teistro SDK: gates, generators, release steps"

[dependencies]
teistro-ephemeris-builtin = { path = "../crates/ephemeris-builtin", features = ["ingest"] }
flate2 = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "0.11"
tar = "0.4"
teistro = { path = "../crates/sdk" }
teistro-astro = { path = "../crates/astro" }
teistro-calendar = { path = "../crates/calendar" }
teistro-core = { path = "../crates/core" }
teistro-strength = { path = "../crates/strength" }
teistro-ffi = { path = "../crates/ffi" }
teistro-idl = { path = "../crates/idl" }
teistro-interpret = { path = "../crates/interpret" }
teistro-intl = { path = "../crates/intl", default-features = false }
teistro-port-ephemeris = { path = "../crates/port-ephemeris" }
teistro-rules = { path = "../crates/rules" }
teistro-scenario = { path = "../crates/scenario" }
teistro-serial = { path = "../crates/serial", features = ["schema"] }
teistro-siddhanta = { path = "../crates/siddhanta" }
teistro-time = { path = "../crates/time" }
teistro-vargas = { path = "../crates/vargas" }

[lints]
workspace = true
