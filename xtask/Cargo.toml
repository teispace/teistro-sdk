[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Repository tasks for Teistro SDK: gates, generators, release steps"

[dependencies]
flate2 = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "0.11"
tar = "0.4"
teistro-astro = { path = "../crates/astro" }
teistro-calendar = { path = "../crates/calendar" }
teistro-core = { path = "../crates/core" }
teistro-ffi = { path = "../crates/ffi" }
teistro-idl = { path = "../crates/idl" }
teistro-intl = { path = "../crates/intl", default-features = false }
teistro-scenario = { path = "../crates/scenario" }
teistro-siddhanta = { path = "../crates/siddhanta" }
teistro-time = { path = "../crates/time" }

[lints]
workspace = true
