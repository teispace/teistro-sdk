kind: muhurta_yoga
number: 61
version: 2
doc: "The muhurta yogas a day may carry. The members are attested; the tables that say when each holds are module data with marks of their own, chosen by `panchanga.muhurta_tables`: `CLASSICAL`, the rows the corpus could not contradict (`03-design/panchanga-day-conventions.md` §8), or `MUHURTA_CHINTAMANI`, the text's full tables (`03-design/day-markers.md` §2)."
attributes: { auspicious: bool }
members:
  - key: AMRIT_SIDDHI
    id: 0
    doc: "Amrit Siddhi yoga: one vara and nakshatra pair each"
    attributes: { auspicious: true }
    sources:
      - text: "baseline-engine"
        ref: "panchanga_day.muhurta_yogas.amrit_siddhi"
      - text: "Muhurta Chintamani with the Piyushadhara (1954)"
        ref: "Shubhashubha-prakarana vv. 20–21, p. 20: Narada's pairs, हस्तर्क्षं सूर्यवारे …, and the tithi that takes each away"
    mark: T
  - key: SARVARTHA_SIDDHI
    id: 1
    doc: "Sarvartha Siddhi yoga: a set of nakshatras per vara"
    attributes: { auspicious: true }
    sources:
      - text: "baseline-engine"
        ref: "panchanga_day.muhurta_yogas.sarvartha_siddhi"
      - text: "Muhurta Chintamani with the Piyushadhara (1954)"
        ref: "Shubhashubha-prakarana vv. 28–29, p. 22: सूर्येऽर्कमूलोत्तरपुष्यदास्रं … सर्वार्थसिद्ध्यै कथितानि पूर्वैः"
    mark: T
  - key: SIDDHA
    id: 2
    doc: "Siddha yoga"
    attributes: { auspicious: true }
    sources:
      - text: "baseline-engine"
        ref: "panchanga_day.muhurta_yogas.siddha"
    mark: T
  - key: DWIPUSHKAR
    id: 3
    doc: "Dwipushkar yoga: a Bhadra tithi on a Sunday, Tuesday or Saturday in Mrigashira, Chitra or Dhanishtha, the stars a sign boundary cuts two quarters and two, which doubles what the day brings"
    attributes: { auspicious: false }
    sources:
      - text: "baseline-engine"
        ref: "panchanga_day.muhurta_yogas.dwipushkar; no recorded day carries one"
      - text: "Muhurta Chintamani with the Piyushadhara (1954)"
        ref: "Nakshatra-prakarana v. 49, p. 86: द्विगुणकृद्वसुतक्षचान्द्रे"
    mark: T
  - key: TRIPUSHKAR
    id: 4
    doc: "Tripushkar yoga: a Bhadra tithi on a Sunday, Tuesday or Saturday in a three-footed nakshatra, which triples what the day brings"
    attributes: { auspicious: false }
    sources:
      - text: "baseline-engine"
        ref: "panchanga_day.muhurta_yogas.tripushkar, measured: the classical rule reproduces the corpus's one instance with no false positives"
      - text: "Muhurta Chintamani with the Piyushadhara (1954)"
        ref: "Nakshatra-prakarana v. 49, p. 86: भद्रातिथी रविजभूतनयार्कवारे द्वीशार्यमाजचरणादितिवह्निवैश्वे"
    mark: V
  - key: RAVI_PUSHYA
    id: 5
    doc: "Ravi Pushya yoga: Pushya on a Sunday, one of Muhurta Chintamani's Sunday Sarvartha Siddhi stars, named so in the almanacs"
    attributes: { auspicious: true }
    sources:
      - text: "Muhurta Chintamani with the Piyushadhara (1954)"
        ref: "Shubhashubha-prakarana v. 28, p. 22: सूर्येऽर्कमूलोत्तरपुष्यदास्रं; the name is the almanacs' (crux C1050)"
    mark: T
  - key: GURU_PUSHYA
    id: 6
    doc: "Guru Pushya yoga: Pushya on a Thursday, Thursday's Amrit Siddhi, barred only for a marriage"
    attributes: { auspicious: true }
    sources:
      - text: "Muhurta Chintamani with the Piyushadhara (1954)"
        ref: "Shubhashubha-prakarana vv. 21–22, p. 20: नवम्यां गुरुपुष्यं …, गुरौ पुष्यं विवर्जयेत् in a marriage"
    mark: V
