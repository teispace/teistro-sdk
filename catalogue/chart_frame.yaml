  - key: MOON
    id: 1
    doc: "The Moon's sign as house 1, the grahas in their signs: the rashi (chandra) kundali"
    sources:
      - text: "printed Nepali janma patrikas"
        ref: "the रा chart of a second printer's form and the राशिकुण्डली of the first, read 2026-11-10: house 1 holds the Moon's sign, the houses follow in order"
    mark: V
  - key: SUN
    id: 2
    doc: "The Sun's sign as house 1, the grahas in their signs: the surya kundali"
    sources:
      - text: "BPHS"
