        ref: "`03-design/festival-metadata.md` §2"
    mark: V
  - key: REGIONAL_ETHNIC
    id: 2
    doc: "Not gazetted; kept by one community or people the classification names"
    sources:
      - text: "`03-design/festival-classification.md` §3, §4"
        ref: "`03-design/festival-metadata.md` §2"
    mark: V
  - key: OBSERVANCE
    id: 3
    doc: "Not gazetted; a civil date fixed by law, an institution or an organisation"
