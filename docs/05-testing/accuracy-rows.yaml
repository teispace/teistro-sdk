# The rows of the accuracy document (`ACCURACY.md`, generated by
# `cargo xtask accuracy` and held by `check-accuracy`): the astronomy
# layer's areas as `01-research/platform/13-astronomy-layer.md` lists them,
# each with its conformance target from that page, the design page that
# owns it, the evidence a reader can rerun, and the measurements that need
# the engine present and are run by hand (with their date). The measured
# columns that CI can produce come from the tests themselves
# (`crates/astro/tests/common/mod.rs`), keyed by `id`.
rows:
  - id: time_scales
    area: time scales
    target: exact
    page: 03-design/time-and-timezone.md
    evidence: "TT, UT1 and UTC with the IERS leap seconds; two-part Julian dates keep sub-millisecond resolution (`iau::tests::two_part_dates_agree_with_one_part_dates_to_the_resolution_of_a_double`); the 55 fixture charts reproduce the baseline's instants"
    by_hand: "the conformance kit's `override_dut1`: no engine declares one (2026-09-05)"
  - id: delta_t
    area: Delta T
    target: bit-identical per model
    page: 03-design/time-and-timezone.md
    evidence: "the IERS series regenerated from its source and gated (`cargo xtask check-time`); Espenak and Meeus beyond it with Morrison and Stephenson's uncertainties"
    by_hand: "the kit's `override_delta_t`: Teimeris's and the Swiss Ephemeris's native Delta T within 0.33 s of the table, at its last row (2026-09-05)"
  - id: sidereal_time
    area: sidereal time
    target: "1e-9″"
    page: 03-design/astro-events-and-crossings.md
    evidence: "`gmst00`, `ee00b`, `gst00b`, `era00` against ERFA's reference values to 1e-12 rad (`iau::tests`)"
    by_hand: "against Teimeris's GAST: 0.0013″ around 2000, 0.088″ at 1850 inside its IERS window; its own 1.9″ step at 2050 and 0.1″ step at 1850 are its (`02-engine-findings.md`, F1; 2026-09-05)"
  - id: precession
    area: precession
    target: bit-identical per model
    page: 03-design/astro-timescales-and-frames.md
    evidence: "`p06e`, `pfw06`, `fw2m`, `pmat06`, `bp06`, `bi00`, `ltpecl`, `ltpequ`, `ltp`, `ltpb` against ERFA's reference values; the Vondrák obliquity series a microarcsecond from IAU 2006 at J2000.0; every model the identity at J2000.0 and orthogonal"
    by_hand: "exercised through the ayanamsha catalogue against Teimeris over 1044 rows from −700 to 2500 (the CI row below), and its mean obliquity to the printed digit at four instants (`teimeris_stars.rs`)"
  - id: nutation
    area: nutation and obliquity
    target: "1e-9″"
    page: 03-design/astro-timescales-and-frames.md
    evidence: "`nut00b` (the 77-term table checked row by row), `obl06`, `obl80`, `numat` against ERFA's reference values"
    by_hand: "the kit's `override_obliquity`: Teimeris's and the Swiss Ephemeris's native obliquity within 4.0e-4″ of the SDK's IAU 2006 and 2000B (2026-09-05)"
  - id: frame_bias
    area: frame bias and reference frames
    target: bit-identical
    page: 03-design/astro-star-table.md
    evidence: "`bp06`'s bias matrix and `bi00` against ERFA; the star table's places over the engine's own astrometry bit for bit on the mean equator of date (the CI row below)"
  - id: completion
    area: position completion
    target: "1e-6″ when fed identical geometric vectors"
    page: 03-design/ephemeris-port-and-adapters.md
    evidence: "the coordinate and zodiac steps; the centre, corrections and equinox steps wait for the built-in ephemeris (Phase 3)"
    by_hand: "the kit's completion checks: through the native obliquity 2.0e-10″ from the engine's own ecliptic output, through the SDK's obliquity and nutation 3.9e-4″ (Teimeris and the Swiss Ephemeris, 2026-09-05)"
  - id: topocentric
    area: topocentric correction
    target: "1e-6″"
    page: 03-design/ephemeris-port-and-adapters.md
    evidence: "not built: the completion's centre step is Phase 3's; a topocentric request is answered by a provider that can, as Teimeris does for the baseline's panchanga transitions"
  - id: transforms
    area: coordinate transforms
    target: exact to rounding
    page: 03-design/astro-events-and-crossings.md
    evidence: "the ecliptic and equatorial rotations, the horizontal transform in the rise and set solver, `refco`'s refraction constants against ERFA"
  - id: ayanamsha
    area: ayanamsha catalogue
    target: "epoch-based bit-identical; star-anchored to 0.001″"
    page: 03-design/astro-ayanamsha-catalogue.md
    evidence: "`teimeris_ayanamsha.rs` over `fixtures/teimeris/ayanamsha.json`: 1044 recorded values of Teimeris 0.1.0 at 24 Julian epochs from −700 to 2500; the anchored members' bounds carry the two tables' astrometry (cruxes C40 to C42)"
  - id: star_table
    area: star table
    target: "0.01″"
    page: 03-design/astro-star-table.md
    evidence: "`teimeris_stars.rs` over `fixtures/teimeris/stars.json`: 126 stars at four instants, the pipeline over the engine's own astrometry and the two catalogues' astrometry apart; `epv00`, `pmpx`, `ab`, `ld`, `ldsun` against ERFA's reference values"
    by_hand: "three of the engine's named rows point at other stars or carry stale motions (`02-engine-findings.md`, F5)"
  - id: houses
    area: house systems
    target: "1e-6° against Teimeris at 10 latitudes, including the polar failure modes"
    page: 03-design/astro-house-systems.md
    evidence: "`teimeris_houses.rs` over `fixtures/teimeris/houses.json` (21 systems, 10 latitudes, 2 longitudes, 3 instants) and `baseline_houses.rs` over the 55 baseline charts"
  - id: rise_set
    area: rise, set, transit
    target: "1 s against Teimeris"
    page: 03-design/astro-events-and-crossings.md
    evidence: "the solver's own tests (a fixed star's quarter days, the polar cases, the conventions in order)"
    by_hand: "the kit's rise and set checks: 0.13 s under the geometric convention and 7.3 s under the almanac's at Reykjavík (C34); the baseline's 52 non-polar charts within 2.5 s below 60° and 9.8 s at Fairbanks (C35) (2026-09-05)"
  - id: crossings
    area: crossings and stations
    target: "1 s against Teimeris"
    page: 03-design/astro-events-and-crossings.md
    evidence: "the kernel over the test provider and a synthetic looping planet; the solver's smooth-curve and step-function costs"
    by_hand: "the Sun's twelve ingresses within 0.001 s, Mercury's fourteen within 0.004 s, a lunation's tithis within 0.004 s, Mercury's and Mars's stations within 0.3 s of Teimeris's own searches; the kit's two crossings checks (Mercury's signs over 120 days, the tithis over 30) hold the engine's native search to the kernel within 0.0039 s; the baseline's 280 geocentric panchanga transitions within 7.8 s, median 3.3 s, its own search (2026-09-05)"
  - id: phenomena
    area: planetary phenomena
    target: exact to rounding over the same geometry
    page: 03-design/astro-planetary-phenomena.md
    evidence: "`teimeris_phenomena.rs` over `fixtures/teimeris/pheno.json`: eleven bodies at sixteen instants over the engine's own geometry"
    by_hand: "through the completion over the engine's positions: phase angles within 1.6e-12°, magnitudes within 1.4e-7; the Sun's disc 0.84″ (the engine's older radius) and the Moon's parallax 0.32″ apart (`02-engine-findings.md`, F2) (2026-09-05)"
  - id: equation_of_time
    area: equation of time
    target: exact
    page: 03-design/astro-planetary-phenomena.md
    evidence: "`teimeris_phenomena.rs`: the engine's equation of time from the same Sun with the SDK's sidereal time, at sixteen instants"
    by_hand: "within 2 µs of Teimeris over every day of the year 2000; 0.127 s apart from 2050, the engine's sidereal-time step (F1) (2026-09-05)"
  - id: eclipses
    area: eclipses and occultations
    target: "v1.x, 1 s of contact times"
    page: 03-design/astro-events-and-crossings.md
    evidence: "not built (v1.x)"
