[package]
name = "teistro-spike-intl"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Spike 4: Teistro Intl, the MessageFormat 2 subset engine, the source conventions, validation, packs and typed accessors for TypeScript and Dart"

[lib]
path = "src/lib.rs"

[[bin]]
name = "teistro-spike-intl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
fixed_decimal = "0.7"
sha2 = "0.11"
icu_locale_core = "2"
icu_plurals = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
teistro-spike-port = { path = "../../03-ephemeris-port/port" }

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
