[package]
name = "teistro-spike-a-gen"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Spike 2, option A: extracts the API description from the C ABI crate and generates the C header, the Node glue, the TypeScript surface and the Dart layer"

[[bin]]
name = "teistro-spike-a-gen"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "3", features = ["full", "extra-traits"] }

[lints]
workspace = true
