[package]
name = "teistro-spike-a-ffi"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Spike 2, option A: the designed C ABI over the slice, with the result blob"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
teistro-spike-slice = { path = "../slice" }

# The one crate kind that may hold unsafe code: the C boundary. Everything
# else in the workspace table is kept, with unsafe lowered from forbid to
# deny so each reviewed block can allow it with a SAFETY comment.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unimplemented = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
indexing_slicing = "warn"
