[package]
name = "teistro-spike-a-node"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Spike 2, option A: the Node addon; everything but lib.rs is generated from the API description"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
teistro-spike-a-ffi = { path = "../../a-ffi" }

[build-dependencies]
napi-build = "2"

# The Node boundary crate: the generated glue holds the unsafe calls into
# the C ABI, each with a SAFETY comment, so unsafe is deny rather than
# forbid; the rest of the workspace table is kept.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unimplemented = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
indexing_slicing = "warn"
