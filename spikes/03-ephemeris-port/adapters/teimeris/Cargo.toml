[package]
name = "teistro-spike-adapter-teimeris"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Spike 3: the Teimeris adapter of the ephemeris port, outside the SDK workspace (ADR-0019); links Teimeris under Teimeris's own terms"

# Standalone on purpose: the adapter depends on the port, never the
# reverse, and the SDK workspace builds without it.
[workspace]

[[bin]]
name = "teistro-spike-adapter-teimeris-kit"
path = "src/bin/kit.rs"

[dependencies]
teistro-spike-port = { path = "../../port" }
teimeris = { path = "../../../../../teimeris/bindings/rust/teimeris" }

# The same table as the SDK workspace; a standalone crate cannot inherit it.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unimplemented = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
indexing_slicing = "warn"
