# The workspace. Every crate of the SDK lives under crates/ (from Phase 1);
# xtask holds the repository's own tasks so that contributors and CI need
# one toolchain and nothing else (ADR-0014).
[workspace]
resolver = "3"
members = [
    "xtask",
    "crates/core",
    "crates/port-ephemeris",
    "crates/astro",
    "crates/siddhanta",
    "crates/port-timezone",
    "crates/time",
    "crates/calendar",
    "crates/chart",
    "crates/panchanga",
    "crates/vargas",
    "crates/state",
    "crates/aspect",
    "crates/points",
    "crates/strength",
    "crates/houses",
    "crates/geometry",
    "crates/dasha",
    "crates/rules",
    "crates/interpret",
    "crates/tajika",
    "crates/render-svg",
    "crates/serial",
    "crates/ephemeris-builtin",
    "crates/ephemeris-kit",
    "crates/scenario",
    "crates/intl",
    "crates/test-allocator",
    "crates/idl",
    "crates/sdk",
    "crates/ffi",
    "bindings/node/native",
    "bindings/wasm/native",
    # Spike 2 (spikes/README.md): built and linted like the rest, never published.
    "spikes/02-binding-toolchain/slice",
    "spikes/02-binding-toolchain/a-ffi",
    "spikes/02-binding-toolchain/a-gen",
    "spikes/02-binding-toolchain/a-node/native",
    "spikes/02-binding-toolchain/b-bridge",
    "spikes/04-teistro-intl/intl",
]
# The licensed-engine adapters are outside the workspace on purpose
# (ADR-0019): they depend on the port, never the reverse, and the workspace
# builds with the test provider alone.
exclude = [
    "adapters/ephemeris-teimeris/rust",
    "adapters/ephemeris-sweph/rust",
]

# One version for the whole SDK: every crate takes it from here, and
# `cargo xtask check-versions` holds the bindings' manifests to it.
[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/teispace/teistro-sdk"
rust-version = "1.85"

# Lints are `warn` here and errors in CI (`-D warnings`), so a contributor's
# editor shows them without a local build failing mid-edit. The second
# group exists because a library that panics, prints or reads outside its
# inputs takes its host down or computes differently per machine
# (ADR-0019, ADR-0022); a tooling binary may allow them at crate level with
# a comment saying why.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unimplemented = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
indexing_slicing = "warn"

# Dev builds are what fills a disk, and almost none of what they write is
# read here. The tests fail by panicking and the gates read the panic, so a
# backtrace wants a file and a line and nothing else; nobody steps through
# `icu` or `serde` in a debugger.
#
# **Incremental stays on, and that is the expensive half rather than the
# debug info.** Measured on this workspace, 2026-09-21, one
# `cargo clippy --workspace --all-targets` and then a re-check after
# touching one file:
#
# |                   | incremental on | incremental off |
# |-------------------|----------------|-----------------|
# | `target/`         | 4.4 GB         | 1.5 GB          |
# | one-file re-check | 4.4 s          | 18.2 s          |
#
# So the cache buys a four-times-faster edit loop for 2.9 GB, and on a
# machine building with two jobs (`CARGO_BUILD_JOBS=2`) that loop is what a
# session is made of. It is kept — but it is a **choice**, so: add
# `incremental = false` below to trade the other way, and
# `rm -rf target/debug/incremental` reclaims the 2.9 GB at the cost of one
# slow pass. The adapters, excluded from this workspace (ADR-0019) and
# edited rarely, turn it off in their own manifests, where the same cache
# was 2.2 GB of a 3.4 GB tree and bought nothing.
[profile.dev]
debug = "line-tables-only"

# A dependency carries no debug information at all: `*` is every package
# that is not a member of this workspace, so the SDK's own crates keep their
# file and line and the graph beneath them stops paying for DWARF nobody
# reads.
[profile.dev.package."*"]
debug = false

# The astronomy is optimised even in a dev build, since every gate runs
# under this profile and the IAU series (nutation, the Earth's position)
# are most of what a gate that reads the sky spends: unoptimised, the
# annual dashas' pass took 33 minutes on CI. Rust does not reorder or
# contract float arithmetic at any optimisation level, so the numbers are
# the same bits; every generated page reproduced byte for byte under it.
# Stepping through `teistro-astro` in a debugger is what it costs.
[profile.dev.package.teistro-astro]
opt-level = 3

# The transcendental functions, for the same reason: `teistro_core::math`
# takes them from `libm`, which a dev build otherwise compiles unoptimised,
# where the platform's C library it replaced was always optimised. Left at
# the default, it nearly doubled the fast check's two slowest pages (the
# Muntha's 205 s to 386 s, the annual chart's 40 s to 71 s). The bits are
# the same at every level, as above.
[profile.dev.package.libm]
opt-level = 3

# And the built-in ephemeris's series, which is where those functions are
# called from: a planet is a few thousand terms, each a cosine and a power
# of time. Unoptimised, it was a seventh of the annual chart's gate (31.6 s
# of CPU to 27.1 s on this machine), and the bits are the same.
[profile.dev.package.teistro-ephemeris-builtin]
opt-level = 3

# The wasm module a package ships: built for its size, since a browser
# downloads it, and measured before it was chosen (2026-09-25, the compact
# module bound by wasm-bindgen with its name section removed, and a
# workload of 20 000 position cells and 300 charts through the package):
#
# |                                | shipped | gzip    | positions | charts |
# |--------------------------------|---------|---------|-----------|--------|
# | release (opt-level 3)          | 6.80 MB | 1.95 MB | 547 ms    | 155 ms |
# | opt-level `s`                  | 5.33 MB | 1.63 MB | 574 ms    | 174 ms |
# | fat LTO, one codegen unit, `s` | 5.24 MB | 1.61 MB | 508 ms    | 160 ms |
# | fat LTO, one codegen unit, 3   | 6.25 MB | 1.94 MB | 461 ms    | 148 ms |
#
# The third is 23% smaller than the release build and as fast. Rust does
# not reorder or contract floats at any of these settings, so the bits are
# the ones every other build computes; `check-wasm` holds the browser's to
# Node's. The native builds keep `release`.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
