# The workspace. Every crate of the SDK lives under crates/ (from Phase 1);
# xtask holds the repository's own tasks so that contributors and CI need
# one toolchain and nothing else (ADR-0014).
[workspace]
resolver = "3"
members = ["xtask"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/teispace/teistro-sdk"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
